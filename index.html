<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Physics Regent – Master Physics Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="duolingo-theme.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const FORMULAS = [
      { id: 1, name: "Displacement", formula: "Δx = v₀t + ½at²", unit: "unit1", category: "Kinematics" },
      { id: 2, name: "Velocity", formula: "v = v₀ + at", unit: "unit1", category: "Kinematics" },
      { id: 3, name: "Average Velocity", formula: "v_avg = Δx/Δt", unit: "unit1", category: "Kinematics" },
      { id: 4, name: "Acceleration", formula: "a = Δv/Δt", unit: "unit1", category: "Kinematics" },
      { id: 5, name: "Kinematic Equation", formula: "v² = v₀² + 2aΔx", unit: "unit1", category: "Kinematics" },
      { id: 6, name: "Vectors - Magnitude", formula: "|v| = √(vₓ² + vᵧ²)", unit: "unit1", category: "Vectors" },
      { id: 7, name: "Vectors - Components", formula: "vₓ = v cos(θ), vᵧ = v sin(θ)", unit: "unit1", category: "Vectors" },
      { id: 8, name: "Projectile Range", formula: "R = (v₀² sin(2θ))/g", unit: "unit1", category: "Projectile Motion" },
      { id: 9, name: "Projectile Max Height", formula: "h = (v₀² sin²(θ))/(2g)", unit: "unit1", category: "Projectile Motion" },
      { id: 10, name: "Newton's Second Law", formula: "F = ma", unit: "unit2", category: "Forces" },
      { id: 11, name: "Friction Force", formula: "f = μN", unit: "unit2", category: "Forces" },
      { id: 12, name: "Weight", formula: "W = mg", unit: "unit2", category: "Forces" },
      { id: 13, name: "Gravitational Force", formula: "F_g = G(m₁m₂)/r²", unit: "unit2", category: "Forces" },
      { id: 14, name: "Spring Force", formula: "F = kx", unit: "unit2", category: "Forces" },
      { id: 15, name: "Centripetal Force", formula: "F_c = mv²/r", unit: "unit2", category: "Circular Motion" },
      { id: 16, name: "Centripetal Acceleration", formula: "a_c = v²/r", unit: "unit2", category: "Circular Motion" },
      { id: 17, name: "Angular Velocity", formula: "ω = Δθ/Δt", unit: "unit2", category: "Circular Motion" },
      { id: 18, name: "Relationship v and ω", formula: "v = ωr", unit: "unit2", category: "Circular Motion" },
      { id: 19, name: "Moment of Inertia", formula: "I = mr²", unit: "unit2", category: "Rotational" },
      { id: 20, name: "Torque", formula: "τ = Fr sin(θ)", unit: "unit2", category: "Rotational" },
      { id: 21, name: "Angular Momentum", formula: "L = Iω", unit: "unit2", category: "Rotational" },
      { id: 22, name: "Work", formula: "W = F·d·cos(θ)", unit: "unit3", category: "Work & Energy" },
      { id: 23, name: "Power", formula: "P = W/t", unit: "unit3", category: "Work & Energy" },
      { id: 24, name: "Kinetic Energy", formula: "KE = ½mv²", unit: "unit3", category: "Energy" },
      { id: 25, name: "Potential Energy (Gravity)", formula: "PE = mgh", unit: "unit3", category: "Energy" },
      { id: 26, name: "Elastic Potential Energy", formula: "PE_elastic = ½kx²", unit: "unit3", category: "Energy" },
      { id: 27, name: "Mechanical Energy", formula: "E_mech = KE + PE", unit: "unit3", category: "Energy" },
      { id: 28, name: "Work-Energy Theorem", formula: "W_net = ΔKE", unit: "unit3", category: "Work & Energy" },
      { id: 29, name: "Momentum", formula: "p = mv", unit: "unit3", category: "Momentum" },
      { id: 30, name: "Impulse", formula: "J = FΔt = Δp", unit: "unit3", category: "Momentum" },
      { id: 31, name: "Conservation of Momentum", formula: "p_i = p_f", unit: "unit3", category: "Momentum" },
      { id: 32, name: "Elastic Collision", formula: "v₁' = ((m₁-m₂)v₁ + 2m₂v₂)/(m₁+m₂)", unit: "unit3", category: "Collisions" },
      { id: 33, name: "Inelastic Collision", formula: "(m₁v₁ + m₂v₂) = (m₁+m₂)v_f", unit: "unit3", category: "Collisions" },
      { id: 34, name: "Simple Harmonic Motion", formula: "x = A cos(ωt + φ)", unit: "unit4", category: "Oscillations" },
      { id: 35, name: "SHM Velocity", formula: "v = -Aω sin(ωt + φ)", unit: "unit4", category: "Oscillations" },
      { id: 36, name: "SHM Energy", formula: "E = ½kA²", unit: "unit4", category: "Oscillations" },
      { id: 37, name: "Period of Spring", formula: "T = 2π√(m/k)", unit: "unit4", category: "Oscillations" },
      { id: 38, name: "Period of Pendulum", formula: "T = 2π√(L/g)", unit: "unit4", category: "Oscillations" },
      { id: 39, name: "Wave Speed", formula: "v = fλ", unit: "unit4", category: "Waves" },
      { id: 40, name: "Intensity", formula: "I = P/A", unit: "unit4", category: "Waves" },
      { id: 41, name: "Decibels", formula: "β = 10 log(I/I₀)", unit: "unit4", category: "Sound" },
      { id: 42, name: "Doppler Effect", formula: "f' = f(v ± v_observer)/(v ∓ v_source)", unit: "unit4", category: "Sound" },
      { id: 43, name: "Snell's Law", formula: "n₁ sin(θ₁) = n₂ sin(θ₂)", unit: "unit4", category: "Optics" },
      { id: 44, name: "Lens Equation", formula: "1/f = 1/d_o + 1/d_i", unit: "unit4", category: "Optics" },
      { id: 45, name: "Magnification", formula: "m = -d_i/d_o = h_i/h_o", unit: "unit4", category: "Optics" },
      { id: 46, name: "Young's Double Slit", formula: "dsin(θ) = mλ", unit: "unit4", category: "Optics" },
      { id: 47, name: "Single Slit Diffraction", formula: "a sin(θ) = mλ", unit: "unit4", category: "Optics" },
      { id: 48, name: "Coulomb's Law", formula: "F = k(q₁q₂)/r²", unit: "unit5", category: "Electricity" },
      { id: 49, name: "Electric Field", formula: "E = F/q", unit: "unit5", category: "Electricity" },
      { id: 50, name: "Electric Potential", formula: "V = W/q", unit: "unit5", category: "Electricity" },
      { id: 51, name: "Capacitance", formula: "C = Q/V", unit: "unit5", category: "Electricity" },
      { id: 52, name: "Current", formula: "I = Q/t", unit: "unit5", category: "Electricity" },
      { id: 53, name: "Resistance", formula: "R = ρL/A", unit: "unit5", category: "Electricity" },
      { id: 54, name: "Ohm's Law", formula: "V = IR", unit: "unit5", category: "Electricity" },
      { id: 55, name: "Power in Circuit", formula: "P = VI = I²R = V²/R", unit: "unit5", category: "Electricity" },
      { id: 56, name: "Magnetic Force", formula: "F = qvB sin(θ)", unit: "unit5", category: "Magnetism" },
      { id: 57, name: "Photon Energy", formula: "E = hf = hc/λ", unit: "unit5", category: "Modern Physics" },
      { id: 58, name: "Einstein Mass-Energy", formula: "E = mc²", unit: "unit5", category: "Modern Physics" },
      { id: 59, name: "Radioactive Decay", formula: "N = N₀e^(-λt)", unit: "unit5", category: "Nuclear Physics" }
    ];

    const LESSONS = {
      unit1: {
        id: "unit1",
        title: "Foundations",
        icon: "📐",
        color: "#3b82f6",
        description: "Master the basics of motion and vectors",
        topics: [
          {
            id: "scalars-vectors",
            title: "Scalars & Vectors",
            description: "Learn the difference between magnitude and direction",
            difficulty: "beginner",
            lessons: [
              { id: "lesson-1", title: "What are Scalars?", duration: "5 min", type: "video" },
              { id: "lesson-2", title: "What are Vectors?", duration: "5 min", type: "video" },
              { id: "lesson-3", title: "Practice Quiz", duration: "3 min", type: "quiz" }
            ]
          },
          {
            id: "kinematics",
            title: "Kinematics & Motion",
            description: "Understand velocity, acceleration, and displacement",
            difficulty: "intermediate",
            lessons: [
              { id: "lesson-4", title: "Velocity Basics", duration: "6 min", type: "video" },
              { id: "lesson-5", title: "Acceleration", duration: "6 min", type: "video" },
              { id: "lesson-6", title: "Practice Problems", duration: "5 min", type: "quiz" }
            ]
          }
        ]
      },
      unit2: {
        id: "unit2",
        title: "Forces & Newton's Laws",
        icon: "🎯",
        color: "#ef4444",
        description: "Apply Newton's three laws to solve problems",
        topics: [
          {
            id: "newtons-laws",
            title: "Newton's Laws",
            description: "The three fundamental laws of motion",
            difficulty: "intermediate",
            lessons: [
              { id: "lesson-7", title: "Newton's First Law", duration: "5 min", type: "video" },
              { id: "lesson-8", title: "Newton's Second Law", duration: "6 min", type: "video" },
              { id: "lesson-9", title: "Newton's Third Law", duration: "5 min", type: "video" }
            ]
          }
        ]
      },
      unit3: {
        id: "unit3",
        title: "Energy & Work",
        icon: "⚡",
        color: "#f59e0b",
        description: "Master energy conservation and power",
        topics: []
      },
      unit4: {
        id: "unit4",
        title: "Waves & Optics",
        icon: "🌊",
        color: "#8b5cf6",
        description: "Light, waves, and sound",
        topics: []
      },
      unit5: {
        id: "unit5",
        title: "Modern Physics",
        icon: "💥",
        color: "#06b6d4",
        description: "Quantum mechanics and nuclear physics",
        topics: []
      }
    };

    const App = () => {
      const [page, setPage] = useState("home");
      const [activeUnit, setActiveUnit] = useState(null);
      const [xp, setXp] = useState(() => parseInt(localStorage.getItem("xp") || "0"));
      const [streak, setStreak] = useState(() => parseInt(localStorage.getItem("streak") || "0"));
      const [completed, setCompleted] = useState(() => JSON.parse(localStorage.getItem("completed") || "{}"));
      const [currentFlashcardIndex, setCurrentFlashcardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [masteredFormulas, setMasteredFormulas] = useState(() => JSON.parse(localStorage.getItem("masteredFormulas") || "[]"));

      const level = Math.floor(xp / 100) + 1;
      const xpForLevel = (level - 1) * 100;
      const xpInLevel = xp - xpForLevel;
      const progressPercent = (xpInLevel / 100) * 100;

      const addXp = (amount) => {
        const newXp = xp + amount;
        setXp(newXp);
        localStorage.setItem("xp", newXp);
      };

      const completeLesson = (unitId, topicId, lessonId) => {
        const key = `${unitId}-${topicId}-${lessonId}`;
        if (!completed[key]) {
          const newCompleted = { ...completed, [key]: true };
          setCompleted(newCompleted);
          localStorage.setItem("completed", JSON.stringify(newCompleted));
          addXp(10);
        }
      };

      const markFormulaMastered = (formulaId) => {
        if (!masteredFormulas.includes(formulaId)) {
          const newMastered = [...masteredFormulas, formulaId];
          setMasteredFormulas(newMastered);
          localStorage.setItem("masteredFormulas", JSON.stringify(newMastered));
          addXp(5);
        }
      };

      const HomePage = () => (
        <div className="home-page">
          <header className="home-header">
            <div className="home-header-content">
              <div className="logo-section">
                <div className="logo-icon">⚛️</div>
                <div>
                  <h1 className="logo-title">Nova Physics</h1>
                  <p className="logo-subtitle">Master Regents Physics</p>
                </div>
              </div>
              <div className="stats-bar">
                <div className="stat-item">
                  <div className="stat-icon">🔥</div>
                  <div>
                    <div className="stat-label">Streak</div>
                    <div className="stat-value">{streak} days</div>
                  </div>
                </div>
                <div className="stat-item">
                  <div className="stat-icon">⭐</div>
                  <div>
                    <div className="stat-label">Level</div>
                    <div className="stat-value">{level}</div>
                  </div>
                </div>
                <div className="stat-item">
                  <div className="stat-icon">✨</div>
                  <div>
                    <div className="stat-label">XP</div>
                    <div className="stat-value">{xp.toLocaleString()}</div>
                  </div>
                </div>
              </div>
            </div>
            <div className="progress-section">
              <div className="progress-info">
                <span>Level {level}</span>
                <span>{xpInLevel}/100 XP</span>
              </div>
              <div className="progress-bar-large">
                <div className="progress-fill" style={{ width: `${progressPercent}%` }}></div>
              </div>
            </div>
          </header>

          <main className="home-content">
            <section className="welcome-section">
              <h2>Choose Your Learning Path</h2>
              <p>Start with Foundations and work your way up to Advanced Physics</p>
            </section>

            <div className="units-grid">
              {Object.values(LESSONS).map((unit) => {
                const topicCount = unit.topics.length;
                const completedCount = unit.topics.reduce((count, topic) => {
                  return count + topic.lessons.filter(lesson => completed[`${unit.id}-${topic.id}-${lesson.id}`]).length;
                }, 0);
                const totalLessons = unit.topics.reduce((count, topic) => count + topic.lessons.length, 0);
                const unitProgress = totalLessons ? (completedCount / totalLessons) * 100 : 0;

                return (
                  <div
                    key={unit.id}
                    className="unit-card clickable"
                    style={{ borderTopColor: unit.color }}
                    onClick={() => {
                      setActiveUnit(unit.id);
                      setPage("lessons");
                    }}
                  >
                    <div className="unit-card-header">
                      <span className="unit-icon">{unit.icon}</span>
                      <span className="unit-progress-badge">{completedCount}/{totalLessons}</span>
                    </div>
                    <h3>{unit.title}</h3>
                    <p>{unit.description}</p>
                    <div className="unit-progress-bar">
                      <div className="unit-progress-fill" style={{ width: `${unitProgress}%`, backgroundColor: unit.color }}></div>
                    </div>
                  </div>
                );
              })}
            </div>

            <section className="cta-section">
              <h2>Master Exam Prep</h2>
              <div className="cta-buttons">
                <button className="btn btn-primary" onClick={() => setPage("practice")}>
                  📝 Practice Exam
                </button>
                <button className="btn btn-secondary" onClick={() => { setPage("formulas"); setCurrentFlashcardIndex(0); setIsFlipped(false); }}>
                  📐 Formula Sheet
                </button>
                <button className="btn btn-secondary" onClick={() => { setPage("flashcards"); setCurrentFlashcardIndex(0); setIsFlipped(false); }}>
                  🎴 Flashcards
                </button>
              </div>
            </section>
          </main>
        </div>
      );

      const LessonsPage = () => {
        const unit = LESSONS[activeUnit];
        if (!unit) return <div>Unit not found</div>;

        return (
          <div className="lessons-page">
            <button className="back-btn" onClick={() => setPage("home")}>
              ← Back to Units
            </button>

            <div className="lessons-header">
              <span className="lessons-icon">{unit.icon}</span>
              <div>
                <h1>{unit.title}</h1>
                <p>{unit.description}</p>
              </div>
            </div>

            <div className="topics-list">
              {unit.topics.map((topic) => (
                <div key={topic.id} className="topic-section">
                  <div className="topic-header">
                    <div>
                      <h3>{topic.title}</h3>
                      <p>{topic.description}</p>
                    </div>
                    <span className={`difficulty-badge difficulty-${topic.difficulty}`}>
                      {topic.difficulty}
                    </span>
                  </div>

                  <div className="lessons-sub-grid">
                    {topic.lessons.map((lesson) => {
                      const isCompleted = completed[`${unit.id}-${topic.id}-${lesson.id}`];
                      return (
                        <div
                          key={lesson.id}
                          className={`lesson-card ${isCompleted ? "completed" : ""}`}
                          onClick={() => completeLesson(unit.id, topic.id, lesson.id)}
                        >
                          <div className="lesson-card-header">
                            <span className="lesson-type-icon">
                              {lesson.type === "video" ? "🎬" : "❓"}
                            </span>
                            {isCompleted && <span className="lesson-check">✓</span>}
                          </div>
                          <h4>{lesson.title}</h4>
                          <p className="lesson-duration">⏱️ {lesson.duration}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const PracticePage = () => (
        <div className="practice-page">
          <button className="back-btn" onClick={() => setPage("home")}>
            ← Back
          </button>
          <div className="practice-container">
            <h1>📝 Practice Exam</h1>
            <p>Take a full practice exam with 20 randomized questions</p>
            <button className="btn btn-primary btn-large">Start Practice Exam</button>
          </div>
        </div>
      );

      const FormulasPage = () => (
        <div className="formulas-page">
          <button className="back-btn" onClick={() => setPage("home")}>
            ← Back
          </button>
          <div className="formulas-container">
            <h1>📐 Complete Formula Reference ({FORMULAS.length} Formulas)</h1>
            <p>All 59 essential physics formulas organized by category</p>
            <div className="formulas-grid">
              {FORMULAS.map((formula) => (
                <div key={formula.id} className="formula-card" style={{ borderLeftColor: LESSONS[formula.unit].color }}>
                  <div className="formula-header">
                    <h4>{formula.name}</h4>
                    <span className="formula-category">{formula.category}</span>
                  </div>
                  <div className="formula-content">
                    <code>{formula.formula}</code>
                  </div>
                  <div className="formula-unit-badge" style={{ backgroundColor: LESSONS[formula.unit].color }}>
                    {LESSONS[formula.unit].icon} {LESSONS[formula.unit].title}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      const FlashcardsPage = () => {
        const currentFormula = FORMULAS[currentFlashcardIndex];
        const progress = ((currentFlashcardIndex + 1) / FORMULAS.length) * 100;

        return (
          <div className="flashcards-page">
            <button className="back-btn" onClick={() => setPage("home")}>
              ← Back
            </button>
            <div className="flashcards-container">
              <h1>🎴 Formula Flashcards</h1>
              <div className="flashcard-progress">
                <div className="progress-info-fc">
                  <span>{currentFlashcardIndex + 1} / {FORMULAS.length}</span>
                  <span>Mastered: {masteredFormulas.length}</span>
                </div>
                <div className="progress-bar-fc">
                  <div className="progress-fill-fc" style={{ width: `${progress}%` }}></div>
                </div>
              </div>

              <div className="flashcard-wrapper">
                <div
                  className={`flashcard ${isFlipped ? "flipped" : ""}`}
                  onClick={() => setIsFlipped(!isFlipped)}
                  style={{ backgroundColor: LESSONS[currentFormula.unit].color }}
                >
                  <div className="flashcard-inner">
                    <div className="flashcard-front">
                      <div className="flashcard-label">Formula Name</div>
                      <div className="flashcard-title">{currentFormula.name}</div>
                      <div className="flashcard-hint">Click to reveal formula</div>
                    </div>
                    <div className="flashcard-back">
                      <div className="flashcard-label">Formula</div>
                      <code className="flashcard-formula">{currentFormula.formula}</code>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flashcard-controls">
                <button 
                  className="btn btn-secondary"
                  onClick={() => {
                    setCurrentFlashcardIndex(Math.max(0, currentFlashcardIndex - 1));
                    setIsFlipped(false);
                  }}
                  disabled={currentFlashcardIndex === 0}
                >
                  ← Previous
                </button>
                <button
                  className="btn btn-success"
                  onClick={() => {
                    markFormulaMastered(currentFormula.id);
                  }}
                  style={{ opacity: masteredFormulas.includes(currentFormula.id) ? 0.5 : 1 }}
                >
                  {masteredFormulas.includes(currentFormula.id) ? "✓ Mastered" : "✓ Mark Mastered"}
                </button>
                <button 
                  className="btn btn-secondary"
                  onClick={() => {
                    setCurrentFlashcardIndex(Math.min(FORMULAS.length - 1, currentFlashcardIndex + 1));
                    setIsFlipped(false);
                  }}
                  disabled={currentFlashcardIndex === FORMULAS.length - 1}
                >
                  Next →
                </button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="app">
          {page === "home" && <HomePage />}
          {page === "lessons" && <LessonsPage />}
          {page === "practice" && <PracticePage />}
          {page === "formulas" && <FormulasPage />}
          {page === "flashcards" && <FlashcardsPage />}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
