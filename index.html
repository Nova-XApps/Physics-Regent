function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const EnergyBarSim = () => {
  const [h, setH] = useState(25);
  const m = 2, g = 9.81, maxH = 50;
  const pe = m * g * h;
  const ke = m * g * maxH - pe;
  return (
    <div className="sim-controls">
      <label>Height: {h} m</label>
      <input type="range" min={0} max={maxH} value={h} onChange={e => setH(+e.target.value)} />
      <div className="sim-output">PE<sub>g</sub> = {pe.toFixed(0)} J &nbsp;|&nbsp; KE = {ke.toFixed(0)} J</div>
    </div>
  );
};

const OhmsLawSim = () => {
  const [v, setV] = useState(12);
  const [r, setR] = useState(6);
  const i = (v / r).toFixed(2);
  const p = (v * v / r).toFixed(1);
  return (
    <div className="sim-controls">
      <label>Voltage: {v} V</label>
      <input type="range" min={1} max={24} value={v} onChange={e => setV(+e.target.value)} />
      <label>Resistance: {r} Ω</label>
      <input type="range" min={1} max={20} value={r} onChange={e => setR(+e.target.value)} />
      <div className="sim-output">I = {i} A &nbsp;|&nbsp; P = {p} W</div>
    </div>
  );
};

const WaveSim = () => {
  const [freq, setFreq] = useState(2);
  const [amp, setAmp] = useState(35);
  const points = Array.from({ length: 201 }, (_, i) =>
    `${i * 2},${50 + amp * Math.sin(2 * Math.PI * freq * i / 100)}`
  ).join(' ');
  return (
    <div className="sim-controls">
      <label>Frequency: {freq} Hz</label>
      <input type="range" min={1} max={8} value={freq} onChange={e => setFreq(+e.target.value)} />
      <label>Amplitude: {amp}</label>
      <input type="range" min={10} max={45} value={amp} onChange={e => setAmp(+e.target.value)} />
      <svg width="100%" height="100" viewBox="0 0 400 100">
        <polyline points={points} fill="none" stroke="#8b5cf6" strokeWidth="2" />
      </svg>
      <div className="sim-output">λ ≈ {(340 / freq).toFixed(1)} m (at 340 m/s)</div>
    </div>
  );
};

const ProjectileSim = () => {
  const [angle, setAngle] = useState(45);
  const [speed, setSpeed] = useState(20);
  const rad = angle * Math.PI / 180;
  const vx = speed * Math.cos(rad);
  const vy = speed * Math.sin(rad);
  const time = 2 * vy / 9.81;
  const range = (vx * time).toFixed(1);
  const maxHeight = (vy * vy / (2 * 9.81)).toFixed(1);
  return (
    <div className="sim-controls">
      <label>Angle: {angle}°</label>
      <input type="range" min={5} max={85} value={angle} onChange={e => setAngle(+e.target.value)} />
      <label>Initial speed: {speed} m/s</label>
      <input type="range" min={5} max={40} value={speed} onChange={e => setSpeed(+e.target.value)} />
      <div className="sim-output">Range = {range} m &nbsp;|&nbsp; Max height = {maxHeight} m</div>
    </div>
  );
};

  };

  // ── exam logic ──
  const submitExam = () => {
    clearInterval(timerRef.current);
    setExamSubmitted(true);
    const correct = examDeck.filter((q, i) => examAns[i] === q.ans).length;
    addXp(correct * 15);
  };

  // ── AI tutor ──
  const askTutor = async () => {
    if (!tutorQ.trim() || tutorBusy) return;
    setTutorBusy(true);
    setTutorA('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a helpful, concise tutor for New York Regents Physics (high school level). Explain concepts clearly and include relevant formulas. Keep answers under 200 words.',
          messages: [{ role: 'user', content: tutorQ }]
        })
      });
      const data = await res.json();
      const text = data.content?.map(b => b.text || '').join('') || 'No response received.';
      setTutorA(text);
    } catch (err) {
      setTutorA('Error reaching AI. Check your connection and try again.');
    }
    setTutorBusy(false);
  };

  // ── nav items ──
  const NAV = [
    { id: 'dashboard',   label: '🏠 Dashboard'   },
    { id: 'learn',       label: '📖 Learn'        },
    { id: 'simulations', label: '🔬 Simulations'  },
    { id: 'flashcards',  label: '🃏 Flashcards'   },
    { id: 'quiz',        label: '❓ Quiz'         },
    { id: 'exam',        label: '📝 Exam Mode'    },
    { id: 'formulas',    label: '📐 Formulas'     },
    { id: 'ai-tutor',    label: '🤖 AI Tutor'     },
  ];

  const navigate = p => {
    setPage(p);
    if (p !== 'quiz') setQuizActive(false);
    if (p !== 'exam') setExamActive(false);
  };

  // ─────────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────────
  return (
    <div>
      {/* ── HEADER ── */}
      <div className="header">
        <div className="logo">⚛️ Physics Regents Prep</div>
        <div className="nav">
          {NAV.map(n => (
            <button key={n.id} className={`nav-btn ${page === n.id ? 'active' : ''}`} onClick={() => navigate(n.id)}>
              {n.label}
            </button>
          ))}
        </div>
        <div className="xp-badge">🔥 Lv.{level} · {xp} XP · {xpToNext} to next</div>
      </div>

      {/* ── PAGES ── */}
      <div className="container">

        {/* ───── DASHBOARD ───── */}
        {page === 'dashboard' && (
          <div>
            <h1>Your Study Dashboard</h1>
            <iframe
              className="yt-embed"
              src="https://www.youtube.com/embed/IYruBR8nDjk"
              title="Physics overview"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            />
            <div className="grid-2">
              <div className="card">⭐ XP: {xp}</div>
              <div className="card">🏆 Level: {level}</div>
              <div className="card">✅ Topics done: {completedCount} / {totalTopics}</div>
              <div className="card">⬆️ Next level: {xpToNext} XP away</div>
            </div>
            <div className="card">
              <div>Level {level} progress</div>
              <div className="progress-bar">
                <div className="progress-fill" style={{ width: `${xp % 100}%` }} />
              </div>
            </div>

            <h2>Units</h2>
            <div className="grid-2">
              {Object.values(UNITS).map(u => {
                const done = u.topics.filter(t => completed[`${u.id}-${t.id}`]).length;
                return (
                  <div
                    key={u.id}
                    className="card"
                    style={{ cursor: 'pointer' }}
                    onClick={() => { setPage('learn'); setActiveUnit(u.id); setActiveTopic(null); }}
                  >
                    <div style={{ fontSize: '2rem' }}>{u.icon}</div>
                    <h3>{u.label}</h3>
                    <div style={{ fontSize: '0.85rem', color: '#64748b' }}>{u.topics.length} topics</div>
                    <div className="progress-bar">
                      <div className="progress-fill" style={{ width: `${(done / u.topics.length) * 100}%`, background: u.color }} />
                    </div>
                  </div>
                );
              })}
            </div>

            <h2>Quick Actions</h2>
            <div className="grid-2">
              <button className="card" onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); setPage('flashcards'); }}>🃏 Study Flashcards</button>
              <button className="card" onClick={() => startQuiz('all')}>❓ Take a Quiz</button>
              <button className="card" onClick={() => { setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800); setPage('exam'); }}>📝 Practice Exam</button>
              <button className="card" onClick={() => setPage('formulas')}>📐 Formula Sheet</button>
            </div>
          </div>
        )}

        {/* ───── LEARN ───── */}
        {page === 'learn' && (
          <div className={activeTopic ? 'learn-layout' : ''}>
            <div>
              <h2>Units & Topics</h2>
              {Object.values(UNITS).map(u => (
                <div key={u.id} style={{ marginBottom: '0.75rem' }}>
                  <button
                    className={`sidebar-unit-btn ${activeUnit === u.id ? 'open' : ''}`}
                    onClick={() => setActiveUnit(activeUnit === u.id ? null : u.id)}
                  >
                    {u.icon} {u.label}
                  </button>
                  {activeUnit === u.id && (
                    <div style={{ marginTop: '0.25rem' }}>
                      {u.topics.map(t => (
                        <button
                          key={t.id}
                          className={`sidebar-topic-btn ${activeTopic?.id === t.id ? 'active' : ''} ${completed[`${u.id}-${t.id}`] ? 'done' : ''}`}
                          onClick={() => { setActiveTopic(t); markComplete(`${u.id}-${t.id}`); addXp(5); }}
                        >
                          {completed[`${u.id}-${t.id}`] ? '✅ ' : '○ '}{t.title}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {activeTopic ? (
              <div className="card">
                <h2>{activeTopic.title}</h2>
                <div className="prose" style={{ whiteSpace: 'pre-wrap', marginBottom: '1rem' }}>{activeTopic.content}</div>
                {activeTopic.formulas && (
                  <div>
                    <h3>Key Formulas</h3>
                    <div className="grid-2">
                      {activeTopic.formulas.map((f, i) => (
                        <div key={i} style={{ background: '#f8fafc', padding: '0.5rem', borderRadius: '0.5rem' }}>
                          <code>{f}</code>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <div style={{ marginTop: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                  <button
                    className="card"
                    style={{ padding: '0.5rem 1rem', margin: 0 }}
                    onClick={() => {
                      setFcDeck(shuffle(activeTopic.flashcards || []));
                      setFcIdx(0); setFcFlip(false);
                      setPage('flashcards');
                    }}
                  >🃏 Study Cards</button>
                  <button
                    className="card"
                    style={{ padding: '0.5rem 1rem', margin: 0 }}
                    onClick={() => startQuiz(UNITS[activeUnit]?.label)}
                  >❓ Quiz This Unit</button>
                </div>
              </div>
            ) : (
              <div className="card text-center" style={{ display: activeTopic ? 'block' : 'none' }}>Select a topic on the left</div>
            )}
            {!activeTopic && (
              <div className="card text-center" style={{ marginTop: '1rem' }}>
                <p>Select a topic from the left to start reading.</p>
              </div>
            )}
          </div>
        )}

        {/* ───── SIMULATIONS ───── */}
        {page === 'simulations' && (
          <div>
            <h1>Interactive Simulations</h1>
            <div className="grid-2">
              {SIMULATIONS.map(s => (
                <div key={s.id} className="card" style={{ cursor: 'pointer' }} onClick={() => setSimActive(simActive === s.id ? null : s.id)}>
                  <div style={{ fontSize: '1.5rem' }}>{s.icon}</div>
                  <h3>{s.title}</h3>
                  {simActive === s.id && (
                    <div style={{ marginTop: '1rem' }}>
                      <s.comp />
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ───── FLASHCARDS ───── */}
        {page === 'flashcards' && (
          <div>
            <h1>Flashcards</h1>
            <p style={{ marginBottom: '0.75rem', color: '#64748b', fontSize: '0.85rem' }}>Click the card to flip it.</p>
            {fcDeck.length > 0 ? (
              <>
                <div className="flashcard" onClick={() => setFcFlip(!fcFlip)}>
                  {fcFlip
                    ? (fcDeck[fcIdx]?.a || 'No answer')
                    : (fcDeck[fcIdx]?.q || 'No question')}
                </div>
                <div style={{ textAlign: 'center', marginTop: '0.5rem', color: '#94a3b8', fontSize: '0.8rem' }}>
                  {fcIdx + 1} / {fcDeck.length}
                </div>
                <div className="flex-row" style={{ justifyContent: 'center', marginTop: '0.75rem' }}>
                  <button className="card" style={{ padding: '0.5rem 1.5rem', margin: 0 }}
                    onClick={() => { if (fcIdx > 0) { setFcIdx(fcIdx - 1); setFcFlip(false); } }}>← Prev</button>
                  <button className="card" style={{ padding: '0.5rem 1.5rem', margin: 0 }}
                    onClick={() => { setFcIdx((fcIdx + 1) % fcDeck.length); setFcFlip(false); }}>Next →</button>
                  <button className="card" style={{ padding: '0.5rem 1.5rem', margin: 0 }}
                    onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); }}>🔀 Shuffle</button>
                </div>
              </>
            ) : (
              <p>No flashcards available.</p>
            )}
          </div>
        )}

        {/* ───── QUIZ ───── */}
        {page === 'quiz' && (
          <div>
            {!quizActive ? (
              <div>
                <h1>Choose a Quiz</h1>
                <div className="grid-2">
                  <button className="card" onClick={() => startQuiz('all')}>🌐 All Units</button>
                  {Object.values(UNITS).map(u => (
                    <button key={u.id} className="card" onClick={() => startQuiz(u.label)}>{u.icon} {u.label}</button>
                  ))}
                </div>
              </div>
            ) : quizDone ? (
              <div className="card text-center">
                <div style={{ fontSize: '3rem' }}>{quizScore >= 8 ? '🏆' : quizScore >= 5 ? '👍' : '📚'}</div>
                <h2>{quizScore} / {quizDeck.length} correct</h2>
                <p style={{ margin: '0.5rem 0' }}>+{quizScore * 10 + 20} XP earned</p>
                <button className="card" style={{ display: 'inline-block', margin: '0.5rem auto 0' }} onClick={() => startQuiz('all')}>Try Again</button>
              </div>
            ) : (
              <div>
                <div className="flex-between" style={{ marginBottom: '0.25rem' }}>
                  <span>Question {quizIdx + 1} / {quizDeck.length}</span>
                  <span>✅ {quizScore} correct</span>
                </div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${(quizIdx / quizDeck.length) * 100}%` }} />
                </div>
                <div className="card">
                  <p style={{ fontWeight: 'bold', marginBottom: '1rem' }}>{quizDeck[quizIdx]?.q}</p>
                  <div className="grid-2">
                    {quizDeck[quizIdx]?.opts.map((opt, i) => (
                      <button
                        key={i}
                        className={`quiz-option ${quizSel !== null ? (i === quizDeck[quizIdx].ans ? 'correct' : (i === quizSel ? 'wrong' : '')) : ''}`}
                        onClick={() => handleQuizSelect(i)}
                        disabled={quizSel !== null}
                      >{opt}</button>
                    ))}
                  </div>
                </div>
                {quizSel !== null && (
                  <div className={quizSel === quizDeck[quizIdx].ans ? 'feedback-correct' : 'feedback-wrong'}>
                    <p style={{ fontWeight: 600 }}>{quizSel === quizDeck[quizIdx].ans ? '✅ Correct!' : '❌ Incorrect'}</p>
                    <p style={{ fontSize: '0.85rem', marginTop: '0.25rem' }}>{quizDeck[quizIdx].exp}</p>
                    <button
                      className="card"
                      style={{ display: 'inline-block', marginTop: '0.5rem', padding: '0.4rem 1rem' }}
                      onClick={nextQuiz}
                    >{quizIdx + 1 >= quizDeck.length ? 'See Results' : 'Next →'}</button>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ───── EXAM ───── */}
        {page === 'exam' && (
          <div>
            {!examActive ? (
              <div className="card text-center">
                <h1>Practice Regents Exam</h1>
                <p style={{ margin: '0.75rem 0' }}>20 questions · 30 minute timer · covers all units</p>
                <button
                  className="card"
                  style={{ display: 'inline-block', padding: '0.6rem 1.5rem', margin: 0 }}
                  onClick={() => { setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800); }}
                >Start Exam</button>
              </div>
            ) : examSubmitted ? (
              <div>
                <div className="card text-center">
                  <h2>Score: {examDeck.filter((_, i) => examAns[i] === examDeck[i].ans).length} / {examDeck.length}</h2>
                  <p style={{ margin: '0.5rem 0' }}>+{examDeck.filter((_, i) => examAns[i] === examDeck[i].ans).length * 15} XP</p>
                  <button className="card" style={{ display: 'inline-block', padding: '0.5rem 1.25rem', margin: 0 }} onClick={() => setExamActive(false)}>Retake</button>
                </div>
                {examDeck.map((q, i) => (
                  <div key={i} className="card" style={{ borderLeft: `4px solid ${examAns[i] === q.ans ? '#22c55e' : '#ef4444'}` }}>
                    <p><strong>{i + 1}. {q.q}</strong></p>
                    <p style={{ fontSize: '0.85rem', marginTop: '0.25rem' }}>
                      Your answer: {q.opts[examAns[i]] || '(blank)'}
                      {examAns[i] !== q.ans && <span style={{ color: '#16a34a' }}> · Correct: {q.opts[q.ans]}</span>}
                    </p>
                    <p style={{ fontSize: '0.75rem', color: '#64748b', marginTop: '0.2rem' }}>{q.exp}</p>
                  </div>
                ))}
              </div>
            ) : (
              <div>
                <div className="flex-between" style={{ marginBottom: '0.75rem' }}>
                  <span style={{ fontWeight: 600 }}>⏱ {formatTime(examTime)}</span>
                  <span>{Object.keys(examAns).length} / {examDeck.length} answered</span>
                </div>
                {examDeck.map((q, i) => (
                  <div key={i} className="card">
                    <p style={{ fontWeight: 600, marginBottom: '0.5rem' }}>{i + 1}. {q.q}</p>
                    <div className="grid-2">
                      {q.opts.map((opt, j) => (
                        <button
                          key={j}
                          className="quiz-option"
                          style={{ background: examAns[i] === j ? '#eff6ff' : 'white', borderColor: examAns[i] === j ? '#3b82f6' : '#e2e8f0' }}
                          onClick={() => setExamAns({ ...examAns, [i]: j })}
                        >{opt}</button>
                      ))}
                    </div>
                  </div>
                ))}
                <button
                  style={{ width: '100%', padding: '0.75rem', background: '#1d4ed8', color: 'white', border: 'none', borderRadius: '0.5rem', fontWeight: 600, fontSize: '1rem', marginTop: '0.5rem' }}
                  onClick={submitExam}
                >Submit Exam</button>
              </div>
            )}
          </div>
        )}

        {/* ───── FORMULAS ───── */}
        {page === 'formulas' && (
          <div>
            <h1>Formula Reference Sheet</h1>
            {Object.values(UNITS).map(u => (
              <div key={u.id}>
                <h2 style={{ color: u.color }}>{u.icon} {u.label}</h2>
                <div className="grid-2" style={{ marginBottom: '1rem' }}>
                  {u.topics.flatMap(t =>
                    (t.formulas || []).map((f, i) => (
                      <div key={`${u.id}-${t.id}-${i}`} className="card" style={{ padding: '0.75rem' }}>
                        <code style={{ fontSize: '0.95rem' }}>{f}</code>
                        <div style={{ fontSize: '0.7rem', color: '#94a3b8', marginTop: '0.2rem' }}>{t.title}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* ───── AI TUTOR ───── */}
        {page === 'ai-tutor' && (
          <div>
            <h1>AI Tutor</h1>
            <div className="card">
              <p style={{ marginBottom: '0.75rem', color: '#64748b', fontSize: '0.85rem' }}>
                Ask any Regents Physics question and get a clear, concise explanation.
              </p>
              <textarea
                rows={4}
                style={{ width: '100%', padding: '0.75rem', border: '1px solid #e2e8f0', borderRadius: '0.5rem', fontSize: '0.9rem', resize: 'vertical', fontFamily: 'inherit' }}
                placeholder="e.g. Explain conservation of momentum with an example."
                value={tutorQ}
                onChange={e => setTutorQ(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askTutor(); }}
              />
              <button
                style={{ marginTop: '0.5rem', padding: '0.6rem 1.5rem', background: '#1d4ed8', color: 'white', border: 'none', borderRadius: '0.5rem', fontWeight: 600, opacity: tutorBusy ? 0.6 : 1 }}
                onClick={askTutor}
                disabled={tutorBusy}
              >{tutorBusy ? 'Thinking…' : 'Ask'}</button>
            </div>
            {tutorA && (
              <div className="card" style={{ whiteSpace: 'pre-wrap', lineHeight: 1.6 }}>
                <strong>Answer:</strong>
                <div style={{ marginTop: '0.5rem' }}>{tutorA}</div>
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
