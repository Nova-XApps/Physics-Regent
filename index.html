const shuffle = (arr) => { let a = [...arr]; for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const speak = (text) => { if ('speechSynthesis' in window) { let u = new SpeechSynthesisUtterance(text); u.rate = 0.9; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } };

const EnergySim = () => { let [h, setH] = useState(25); let pe = 2 * 9.81 * h; let ke = 2 * 9.81 * 50 - pe; return (<><label>Height: {h} m</label><input type="range" min="0" max="50" value={h} onChange={e => setH(+e.target.value)} /><div className="sim-output">PE = {pe.toFixed(0)} J | KE = {ke.toFixed(0)} J</div></>); };
const SIMULATIONS = [{ id: "energy", title: "Energy Bar Chart", icon: "⚡", comp: EnergySim }];

const App = () => {
  const [page, setPage] = useState('dashboard');
  const [activeUnit, setActiveUnit] = useState('foundations');
  const [activeTopic, setActiveTopic] = useState(null);
  const [xp, setXp] = useState(() => parseInt(localStorage.getItem('xp') || '0'));
  const [completed, setCompleted] = useState(() => JSON.parse(localStorage.getItem('completed') || '{}'));
  const [streak, setStreak] = useState(() => parseInt(localStorage.getItem('streak') || '0'));
  const [lastStudy, setLastStudy] = useState(() => localStorage.getItem('lastStudy') || '');
  const [wrongTracker, setWrongTracker] = useState(() => JSON.parse(localStorage.getItem('wrongTracker') || '{}'));
  const [fcDeck, setFcDeck] = useState(() => shuffle(ALL_FLASHCARDS));
  const [fcIdx, setFcIdx] = useState(0), [fcFlip, setFcFlip] = useState(false);
  const [quizActive, setQuizActive] = useState(false), [quizDeck, setQuizDeck] = useState([]), [quizIdx, setQuizIdx] = useState(0), [quizSel, setQuizSel] = useState(null), [quizScore, setQuizScore] = useState(0), [quizDone, setQuizDone] = useState(false);
  const [examActive, setExamActive] = useState(false), [examAns, setExamAns] = useState({}), [examSubmitted, setExamSubmitted] = useState(false), [examDeck] = useState(() => shuffle(ALL_QUIZ).slice(0, 10)), [examTime, setExamTime] = useState(1800);
  const [clusterQuizActive, setClusterQuizActive] = useState(false), [activeCluster, setActiveCluster] = useState(null), [clusterQuizIdx, setClusterQuizIdx] = useState(0), [clusterQuizSel, setClusterQuizSel] = useState(null), [clusterQuizScore, setClusterQuizScore] = useState(0), [clusterQuizDone, setClusterQuizDone] = useState(false);
  const [formulaVisible, setFormulaVisible] = useState(false), [theme, setTheme] = useState(localStorage.getItem('theme') || 'dark'), [customQuizMode, setCustomQuizMode] = useState(false), [customTopics, setCustomTopics] = useState([]), [customCount, setCustomCount] = useState(5);
  const timerRef = useRef(null);

  useEffect(() => { document.body.className = theme; localStorage.setItem('theme', theme); }, [theme]);
  useEffect(() => { if (examActive && !examSubmitted) { timerRef.current = setInterval(() => setExamTime(t => t > 0 ? t - 1 : 0), 1000); return () => clearInterval(timerRef.current); } }, [examActive, examSubmitted]);
  useEffect(() => { if (examActive && !examSubmitted && examTime === 0) submitExam(); }, [examTime]);

  const updateStreak = () => { let today = new Date().toDateString(); if (lastStudy !== today) { let ns = lastStudy ? (new Date() - new Date(lastStudy) <= 86400000 ? streak + 1 : 1) : 1; setStreak(ns); setLastStudy(today); localStorage.setItem('streak', ns); localStorage.setItem('lastStudy', today); addXp(ns % 5 === 0 ? 20 : 5); } };
  const addXp = (amt) => { let n = xp + amt; setXp(n); localStorage.setItem('xp', n); };
  const markComplete = (key) => { updateStreak(); let c = { ...completed, [key]: true }; setCompleted(c); localStorage.setItem('completed', JSON.stringify(c)); addXp(5); };
  const trackWrong = (qText, topic) => { let nw = { ...wrongTracker, [qText]: (wrongTracker[qText] || 0) + 1 }; setWrongTracker(nw); localStorage.setItem('wrongTracker', JSON.stringify(nw)); };
  const resetProgress = () => { if (confirm('Reset all progress?')) { setXp(0); setCompleted({}); setWrongTracker({}); setStreak(0); localStorage.clear(); window.location.reload(); } };
  const getNextTopic = (uid, tid) => { let unit = UNITS[uid]; let idx = unit.topics.findIndex(t => t.id === tid); if (idx + 1 < unit.topics.length) return { unitId: uid, topic: unit.topics[idx + 1] }; let ids = Object.keys(UNITS); let uidx = ids.indexOf(uid); if (uidx + 1 < ids.length) return { unitId: ids[uidx + 1], topic: UNITS[ids[uidx + 1]].topics[0] }; return null; };
  const goToNextTopic = () => { let next = getNextTopic(activeUnit, activeTopic.id); if (next) { setActiveUnit(next.unitId); setActiveTopic(next.topic); markComplete(`${next.unitId}-${next.topic.id}`); } };
  const startQuiz = (filter, customQuestions = null) => { let pool = customQuestions ? customQuestions : (filter === 'all' ? ALL_QUIZ : ALL_QUIZ.filter(q => q.source === filter)); let selected = shuffle(pool).slice(0, customQuestions ? customQuestions.length : 10); setQuizDeck(selected); setQuizIdx(0); setQuizSel(null); setQuizScore(0); setQuizDone(false); setQuizActive(true); setPage('quiz'); };
  const handleQuiz = (idx) => { if (quizSel !== null) return; setQuizSel(idx); if (idx === quizDeck[quizIdx].ans) { setQuizScore(s => s + 1); addXp(10); } else { trackWrong(quizDeck[quizIdx].q, quizDeck[quizIdx].source); } };
  const nextQuiz = () => { if (quizIdx + 1 >= quizDeck.length) { setQuizDone(true); addXp(20); } else { setQuizIdx(i => i + 1); setQuizSel(null); } };
  const submitExam = () => { clearInterval(timerRef.current); setExamSubmitted(true); let correct = 0; examDeck.forEach((q, i) => { if (examAns[i] === q.ans) correct++; else trackWrong(q.q, q.source); }); addXp(correct * 15); };
  const startCustomQuiz = () => { let pool = customTopics.length ? ALL_QUIZ.filter(q => customTopics.includes(q.source)) : ALL_QUIZ; if (pool.length === 0) pool = ALL_QUIZ; startQuiz('custom', shuffle(pool).slice(0, customCount)); setCustomQuizMode(false); };
  const exportProgress = () => { let data = { xp, completed, wrongTracker, streak }; let blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = 'nova_progress.json'; a.click(); URL.revokeObjectURL(url); };
  const importProgress = (e) => { let file = e.target.files[0]; if (!file) return; let reader = new FileReader(); reader.onload = ev => { let data = JSON.parse(ev.target.result); setXp(data.xp || 0); setCompleted(data.completed || {}); setWrongTracker(data.wrongTracker || {}); setStreak(data.streak || 0); localStorage.setItem('xp', data.xp || 0); localStorage.setItem('completed', JSON.stringify(data.completed || {})); localStorage.setItem('wrongTracker', JSON.stringify(data.wrongTracker || {})); localStorage.setItem('streak', data.streak || 0); alert('Progress imported!'); }; reader.readAsText(file); };
  const printNotes = () => { if (!activeTopic) return; let content = `<html><head><title>${activeTopic.title}</title><style>body{font-family:sans-serif;padding:2rem;}</style></head><body><h1>${activeTopic.title}</h1><p>${activeTopic.content}</p><h2>Formulas</h2><ul>${(activeTopic.formulas || []).map(f => `<li>${f}</li>`).join('')}</ul></body></html>`; let win = window.open(); win.document.write(content); win.print(); };

  const level = Math.floor(xp / 100) + 1;
  const totalTopics = Object.values(UNITS).reduce((s, u) => s + u.topics.length, 0);
  const completedCount = Object.keys(completed).length;
  const weakTopics = Object.entries(wrongTracker).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const NAV = [{ id: 'dashboard', label: '🏠' }, { id: 'learn', label: '📖' }, { id: 'simulations', label: '🔬' }, { id: 'flashcards', label: '🃏' }, { id: 'quiz', label: '❓' }, { id: 'exam', label: '📝' }, { id: 'clusters', label: '📚' }, { id: 'reference', label: '📖' }, { id: 'formulas', label: '📐' }];

  return (
    <div>
      <div className="header">
        <div className="logo">⚛️ Nova Physics Regents+</div>
        <div className="nav">{NAV.map(n => <button key={n.id} className={`nav-btn ${page === n.id ? 'active' : ''}`} onClick={() => { setPage(n.id); setQuizActive(false); setExamActive(false); setClusterQuizActive(false); setCustomQuizMode(false); }}>{n.label}</button>)}</div>
        <div className="xp-badge">🔥 Lv.{level} · {xp} XP · Streak {streak} 🔥<button className="theme-toggle" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>{theme === 'dark' ? '☀️' : '🌙'}</button><button className="reset-btn" onClick={resetProgress}>↺</button></div>
      </div>
      <div className="container">
        {page === 'dashboard' && (
          <>
            <h1>Nova Dashboard</h1>
            <div className="card" style={{ marginBottom: '1rem', background: 'var(--surface2)' }}><div className="flex-between"><span>🔥 {streak} day streak!</span><span>⬆️ {xp % 100}/100 to Lv.{level + 1}</span></div><div className="progress-bar"><div className="progress-fill" style={{ width: `${xp % 100}%` }} /></div></div>
            <div className="grid-2"><div className="card"><div>✅ Topics</div><div style={{ fontSize: '2rem' }}>{completedCount}/{totalTopics}</div></div><div className="card"><div>📊 Weakest</div><div style={{ fontSize: '0.9rem' }}>{weakTopics.length ? weakTopics[0][0].slice(0, 40) : 'None'}</div></div><div className="card"><div>📥 Progress</div><div className="flex-row"><button className="btn btn-secondary" onClick={exportProgress}>📤 Export</button><input type="file" accept=".json" onChange={importProgress} style={{ fontSize: '0.7rem' }} /></div></div></div>
            {weakTopics.length > 0 && <div className="card"><h3>📉 Review These</h3>{weakTopics.map(([q, c]) => <div key={q} className="weakness-card">❌ {q.slice(0, 60)} ({c}x)</div>)}<button className="btn btn-primary" onClick={() => startQuiz('all')}>Practice →</button></div>}
            <div className="grid-2" style={{ marginTop: '1rem' }}>{Object.values(UNITS).map(u => { let done = u.topics.filter(t => completed[`${u.id}-${t.id}`]).length; let mastery = done === u.topics.length; return <div key={u.id} className={`card unit-card ${mastery ? 'completed' : ''}`} onClick={() => { setPage('learn'); setActiveUnit(u.id); setActiveTopic(null); }}><span className="unit-icon">{u.icon}</span><h3>{u.label}{mastery && <span className="mastery-badge">🌟</span>}</h3><div className="progress-bar"><div className="progress-fill" style={{ width: `${(done / u.topics.length) * 100}%`, background: u.color }} /></div></div>; })}</div>
            <div className="grid-2"><button className="card" onClick={() => setCustomQuizMode(true)}>🎯 Custom Quiz</button><button className="card" onClick={() => { setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800); setPage('exam'); }}>📝 Exam</button><button className="card" onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setPage('flashcards'); }}>🃏 Cards</button></div>
            {customQuizMode && <div className="card"><h3>Build Quiz</h3><div className="grid-2">{Object.values(UNITS).map(u => <label key={u.id}><input type="checkbox" checked={customTopics.includes(u.label)} onChange={e => { if (e.target.checked) setCustomTopics([...customTopics, u.label]); else setCustomTopics(customTopics.filter(t => t !== u.label)); }} /> {u.label}</label>)}</div><label>Questions: </label><input type="number" min="3" max="20" value={customCount} onChange={e => setCustomCount(Math.min(20, Math.max(3, parseInt(e.target.value) || 5)))} /><div className="flex-row"><button className="btn btn-primary" onClick={startCustomQuiz}>Start ({customCount})</button><button className="btn btn-secondary" onClick={() => setCustomQuizMode(false)}>Cancel</button></div></div>}
          </>
        )}
        {page === 'learn' && (
          <div className="learn-layout">
            <div className="learn-sidebar">{Object.values(UNITS).map(u => <div key={u.id}><button className="sidebar-unit-btn" onClick={() => setActiveUnit(u.id)}>{u.icon} {u.label}</button>{activeUnit === u.id && u.topics.map(t => <button key={t.id} className={`sidebar-topic-btn ${activeTopic?.id === t.id ? 'active' : ''} ${completed[`${u.id}-${t.id}`] ? 'done' : ''}`} onClick={() => { setActiveTopic(t); markComplete(`${u.id}-${t.id}`); }}>{completed[`${u.id}-${t.id}`] ? '✅ ' : '○ '}{t.title}</button>)}</div>)}</div>
            {activeTopic ? <div className="card"><h2>{activeTopic.title}<button className="btn btn-secondary" style={{ marginLeft: '0.5rem' }} onClick={() => speak(activeTopic.content)}>🔊</button><button className="btn btn-secondary" onClick={printNotes}>🖨️</button></h2><div className="prose">{activeTopic.content}</div>{activeTopic.formulas && <><h3>Formulas</h3><div className="grid-2">{activeTopic.formulas.map((f, i) => <div key={i} className="card" style={{ background: 'var(--surface2)' }}><code>{f}</code></div>)}</div></>}<div className="flex-row"><button className="btn btn-primary" onClick={() => startQuiz(UNITS[activeUnit]?.label)}>❓ Quiz</button>{getNextTopic(activeUnit, activeTopic.id) && <button className="btn btn-primary" onClick={goToNextTopic}>Next →</button>}</div></div> : <div className="card text-center">👈 Select a topic</div>}
          </div>
        )}
        {page === 'simulations' && <><h1>Simulations</h1><div className="grid-2">{SIMULATIONS.map(s => <div key={s.id} className="card"><div style={{ fontSize: '2rem' }}>{s.icon}</div><h3>{s.title}</h3><s.comp /></div>)}</div></>}
        {page === 'flashcards' && <><h1>Flashcards</h1>{fcDeck.length ? <><div className="flashcard" onClick={() => setFcFlip(!fcFlip)}>{fcFlip ? fcDeck[fcIdx]?.a : fcDeck[fcIdx]?.q}</div><div className="flex-row"><button className="btn btn-secondary" onClick={() => { if (fcIdx > 0) { setFcIdx(fcIdx - 1); setFcFlip(false); } }}>←</button><button className="btn btn-primary" onClick={() => { setFcIdx((fcIdx + 1) % fcDeck.length); setFcFlip(false); }}>→</button><button className="btn btn-secondary" onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); }}>🔀</button></div></> : <p>No cards</p>}</>}
        {page === 'quiz' && (<>{!quizActive ? <div><h1>Quiz</h1><div className="grid-2"><button className="card" onClick={() => startQuiz('all')}>🌐 All</button>{Object.values(UNITS).map(u => <button key={u.id} className="card" onClick={() => startQuiz(u.label)}>{u.icon} {u.label}</button>)}</div></div> : quizDone ? <div className="card text-center"><div style={{ fontSize: '3rem' }}>{quizScore >= 8 ? '🏆' : '👍'}</div><h2>{quizScore}/{quizDeck.length}</h2><p>+{quizScore * 10 + 20} XP</p><button className="btn btn-primary" onClick={() => setQuizActive(false)}>Back</button></div> : <><div className="flex-between"><span>Q{quizIdx + 1}/{quizDeck.length}</span><span>✅ {quizScore}</span><button className="btn btn-secondary" onClick={() => speak(quizDeck[quizIdx]?.q)}>🔊</button></div><div className="progress-bar"><div className="progress-fill" style={{ width: `${(quizIdx / quizDeck.length) * 100}%` }} /></div><div className="card"><p style={{ fontWeight: 600 }}>{quizDeck[quizIdx]?.q}</p><div className="grid-2">{quizDeck[quizIdx]?.opts.map((opt, i) => <button key={i} className={`quiz-option ${quizSel !== null ? (i === quizDeck[quizIdx].ans ? 'correct' : (i === quizSel ? 'wrong' : '')) : ''}`} onClick={() => handleQuiz(i)} disabled={quizSel !== null}>{opt}</button>)}</div></div>{quizSel !== null && <div className={quizSel === quizDeck[quizIdx].ans ? 'feedback-correct' : 'feedback-wrong'}><p>{quizDeck[quizIdx].exp}</p><button className="btn btn-primary" onClick={nextQuiz}>{quizIdx + 1 >= quizDeck.length ? 'Results' : 'Next →'}</button></div>}</>}</>)}
        {page === 'exam' && (<>{!examActive ? <div className="card text-center"><h1>Practice Exam</h1><p>10 questions · 30 min</p><button className="btn btn-primary" onClick={() => { setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800); }}>Start</button></div> : examSubmitted ? <div><div className="card text-center"><h2>{examDeck.filter((_, i) => examAns[i] === examDeck[i].ans).length}/{examDeck.length}</h2><p>+{examDeck.filter((_, i) => examAns[i] === examDeck[i].ans).length * 15} XP</p><button className="btn btn-secondary" onClick={() => setExamActive(false)}>Back</button></div></div> : <><div className="flex-between"><span>⏱ {Math.floor(examTime / 60)}:{(examTime % 60).toString().padStart(2, '0')}</span><span>{Object.keys(examAns).length}/{examDeck.length}</span></div>{examDeck.map((q, i) => <div key={i} className="card"><p><strong>{i + 1}. {q.q}</strong></p><div className="grid-2">{q.opts.map((opt, j) => <button key={j} className="quiz-option" style={{ background: examAns[i] === j ? 'rgba(124,58,237,0.2)' : '' }} onClick={() => setExamAns({ ...examAns, [i]: j })}>{opt}</button>)}</div></div>)}<button className="btn btn-primary" style={{ width: '100%' }} onClick={submitExam}>Submit</button></>}</>)}
        {page === 'clusters' && (<>{!clusterQuizActive ? <><h1>Clusters</h1><div className="grid-2">{CLUSTERS.map(c => <div key={c.id} className="card" style={{ cursor: 'pointer' }} onClick={() => { setActiveCluster(c); setClusterQuizIdx(0); setClusterQuizSel(null); setClusterQuizScore(0); setClusterQuizDone(false); setClusterQuizActive(true); }}><h3>{c.title}</h3><span style={{ color: 'var(--nova-light)' }}>→</span></div>)}</div></> : clusterQuizDone ? <div className="card text-center"><h2>{clusterQuizScore}/{activeCluster?.questions.length}</h2><button className="btn btn-secondary" onClick={() => setClusterQuizActive(false)}>Back</button></div> : <><div className="flex-between"><span>Q{clusterQuizIdx + 1}/{activeCluster?.questions.length}</span><span>✅ {clusterQuizScore}</span></div><div className="card"><p style={{ fontWeight: 600 }}>{activeCluster?.questions[clusterQuizIdx]?.q}</p><div className="grid-2">{activeCluster?.questions[clusterQuizIdx]?.opts.map((opt, i) => <button key={i} className={`quiz-option ${clusterQuizSel !== null ? (i === activeCluster.questions[clusterQuizIdx].ans ? 'correct' : (i === clusterQuizSel ? 'wrong' : '')) : ''}`} onClick={() => { if (clusterQuizSel !== null) return; setClusterQuizSel(i); if (i === activeCluster.questions[clusterQuizIdx].ans) { setClusterQuizScore(s => s + 1); addXp(10); } else trackWrong(activeCluster.questions[clusterQuizIdx].q, activeCluster.title); }} disabled={clusterQuizSel !== null}>{opt}</button>)}</div></div>{clusterQuizSel !== null && <div className={clusterQuizSel === activeCluster.questions[clusterQuizIdx].ans ? 'feedback-correct' : 'feedback-wrong'}><p>{activeCluster.questions[clusterQuizIdx].exp}</p><button className="btn btn-primary" onClick={() => { if (clusterQuizIdx + 1 >= activeCluster.questions.length) { setClusterQuizDone(true); addXp(20); } else { setClusterQuizIdx(i => i + 1); setClusterQuizSel(null); } }}>{clusterQuizIdx + 1 >= activeCluster.questions.length ? 'Results' : 'Next →'}</button></div>}</>}</>)}

    </div>

</script>
