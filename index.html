      return <div><div className="header"><div className="logo">⚛️ Nova Physics Regents</div><div className="nav">{NAV.map(n=><button key={n.id} className={`nav-btn ${page===n.id?'active':''}`} onClick={()=>{setPage(n.id); setQuizActive(false); setExamActive(false); setClusterQuizActive(false); setActiveCluster(null);}}>{n.label}</button>)}</div><div className="xp-badge">🔥 Lv.{level} · {xp} XP · {xpToNext} to next <button className="reset-btn" onClick={resetProgress}>Reset</button></div></div>
      <div className="container">
        {page==='dashboard' && <div><h1>Your Nova Dashboard</h1><iframe className="yt-embed" src="https://www.youtube.com/embed/IYruBR8nDjk" title="Review" allowFullScreen></iframe><div className="grid-2"><div className="card">⭐ XP: {xp}</div><div className="card">🏆 Level: {level}</div><div className="card">✅ Topics: {completedCount}/{totalTopics}</div><div className="card">⬆️ Next: {xpToNext} XP</div></div><div className="card"><div>Level {level} progress</div><div className="progress-bar"><div className="progress-fill" style={{width:`${xp%100}%`}}/></div></div><h2>Units</h2><div className="grid-2">{Object.values(UNITS).map(u=>{ let done = u.topics.filter(t=>completed[`${u.id}-${t.id}`]).length; let mastery = done === u.topics.length; return <div key={u.id} className={`card unit-card ${mastery ? 'completed' : ''}`} style={{cursor:'pointer'}} onClick={()=>{setPage('learn'); setActiveUnit(u.id); setActiveTopic(null);}}><div style={{fontSize:'2rem'}}>{u.icon}</div><h3>{u.label} {mastery && <span className="mastery-badge">🌟 Mastered</span>}</h3><div>{done}/{u.topics.length} topics</div><div className="progress-bar"><div className="progress-fill" style={{width:`${(done/u.topics.length)*100}%`, background:u.color}}/></div></div>; })}</div><h2>Quick Actions</h2><div className="grid-2"><button className="card" onClick={()=>{setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); setPage('flashcards');}}>🃏 Flashcards</button><button className="card" onClick={()=>startQuiz('all')}>❓ Random Quiz</button><button className="card" onClick={()=>{setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800); setPage('exam');}}>📝 Exam</button><button className="card" onClick={()=>setPage('clusters')}>📚 Practice Clusters</button></div></div>}
        {page==='learn' && <div className="learn-layout"><div>{Object.values(UNITS).map(u=><div key={u.id} style={{marginBottom:'0.75rem'}}><button className={`sidebar-unit-btn ${activeUnit===u.id?'open':''}`} onClick={()=>setActiveUnit(activeUnit===u.id?null:u.id)}>{u.icon} {u.label}</button>{activeUnit===u.id && <div style={{marginTop:'0.25rem'}}>{u.topics.map(t=><button key={t.id} className={`sidebar-topic-btn ${activeTopic?.id===t.id?'active':''} ${completed[`${u.id}-${t.id}`]?'done':''}`} onClick={()=>{setActiveTopic(t); markComplete(`${u.id}-${t.id}`); addXp(5);}}>{completed[`${u.id}-${t.id}`]?'✅ ':'○ '}{t.title}</button>)}</div>}</div>)}</div>{activeTopic ? <div className="card"><h2>{activeTopic.title}</h2><div className="prose" style={{whiteSpace:'pre-wrap'}}>{activeTopic.content}</div>{activeTopic.formulas && <div><h3>Key Formulas</h3><div className="grid-2">{activeTopic.formulas.map((f,i)=><div key={i} className="formula-card" style={{background:'#0a192f',padding:'0.5rem',borderRadius:'0.5rem'}}><code dangerouslySetInnerHTML={{__html: f}} /></div>)}</div></div>}<div style={{marginTop:'1rem',display:'flex',gap:'0.5rem',flexWrap:'wrap'}}><button className="card" style={{padding:'0.5rem 1rem',margin:0}} onClick={()=>{setFcDeck(shuffle(activeTopic.flashcards||[])); setFcIdx(0); setFcFlip(false); setPage('flashcards');}}>🃏 Study</button><button className="card" style={{padding:'0.5rem 1rem',margin:0}} onClick={()=>startQuiz(UNITS[activeUnit]?.label)}>❓ Quiz</button>{(()=>{const next = getNextTopic(activeUnit, activeTopic.id); return next && <button className="next-topic-btn" onClick={goToNextTopic}>➡️ Next Topic: {next.topic.title}</button>;})()}</div></div> : <div className="card text-center"><p>Select a topic from the left.</p></div>}</div>}
        {page==='simulations' && <div><h1>Simulations</h1><div className="grid-2">{SIMULATIONS.map(s=><div key={s.id} className="card" style={{cursor:'pointer'}} onClick={()=>setSimActive(simActive===s.id?null:s.id)}><div style={{fontSize:'1.5rem'}}>{s.icon}</div><h3>{s.title}</h3>{simActive===s.id && <div style={{marginTop:'1rem'}}><s.comp/></div>}</div>)}</div></div>}
        {page==='flashcards' && <div><h1>Flashcards</h1>{fcDeck.length>0?<><div className="flashcard" onClick={()=>setFcFlip(!fcFlip)}>{fcFlip?fcDeck[fcIdx]?.a:fcDeck[fcIdx]?.q}</div><div className="flex-row" style={{justifyContent:'center',marginTop:'0.5rem'}}><button className="card" onClick={()=>{if(fcIdx>0){setFcIdx(fcIdx-1); setFcFlip(false);}}}>← Prev</button><button className="card" onClick={()=>{setFcIdx((fcIdx+1)%fcDeck.length); setFcFlip(false);}}>Next →</button><button className="card" onClick={()=>{setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false);}}>🔀 Shuffle</button></div></>:<p>No flashcards.</p>}</div>}
        {page==='quiz' && <div>{!quizActive?<div><h1>Quiz</h1><div className="grid-2"><button className="card" onClick={()=>startQuiz('all')}>🌐 All Units</button>{Object.values(UNITS).map(u=><button key={u.id} className="card" onClick={()=>startQuiz(u.label)}>{u.icon} {u.label}</button>)}</div></div>:quizDone?<div className="card text-center"><div style={{fontSize:'3rem'}}>{quizScore>=8?'🏆':'👍'}</div><h2>{quizScore}/{quizDeck.length} correct</h2><p>+{quizScore*10+20} XP</p><button className="card" onClick={()=>startQuiz('all')}>Try Again</button></div>:<div><div className="flex-between"><span>Q{quizIdx+1}/{quizDeck.length}</span><span>✅ {quizScore}</span></div><div className="progress-bar"><div className="progress-fill" style={{width:`${(quizIdx/quizDeck.length)*100}%`}}/></div><div className="card"><p style={{fontWeight:'bold'}}>{quizDeck[quizIdx]?.q}</p><div className="grid-2">{quizDeck[quizIdx]?.opts.map((opt,i)=><button key={i} className={`quiz-option ${quizSel!==null?(i===quizDeck[quizIdx].ans?'correct':(i===quizSel?'wrong':'')):''}`} onClick={()=>handleQuiz(i)} disabled={quizSel!==null}>{opt}</button>)}</div></div>{quizSel!==null && <div className={quizSel===quizDeck[quizIdx].ans?'feedback-correct':'feedback-wrong'}><p>{quizSel===quizDeck[quizIdx].ans?'✅ Correct!':'❌ Incorrect'}</p><p>{quizDeck[quizIdx].exp}</p><button className="card" style={{marginTop:'0.5rem'}} onClick={nextQuiz}>{quizIdx+1>=quizDeck.length?'Results':'Next →'}</button></div>}</div>}</div>}
        {page==='exam' && <div>{!examActive?<div className="card text-center"><h1>Practice Regents Exam</h1><p>20 questions · 30 minutes</p><button className="card" onClick={()=>{setExamActive(true); setExamAns({}); setExamSubmitted(false); setExamTime(1800);}}>Start Exam</button></div>:examSubmitted?<div><div className="card text-center"><h2>Score: {examDeck.filter((_,i)=>examAns[i]===examDeck[i].ans).length}/{examDeck.length}</h2><p>+{examDeck.filter((_,i)=>examAns[i]===examDeck[i].ans).length*15} XP</p><button className="card" onClick={()=>setExamActive(false)}>Retake</button></div>{examDeck.map((q,i)=><div key={i} className="card" style={{borderLeft:`4px solid ${examAns[i]===q.ans?'#22c55e':'#ef4444'}`}}><p><strong>{i+1}. {q.q}</strong></p><p>Your answer: {q.opts[examAns[i]]||'(blank)'} {examAns[i]!==q.ans && <span style={{color:'#16a34a'}}> · Correct: {q.opts[q.ans]}</span>}</p><p style={{fontSize:'0.75rem'}}>{q.exp}</p></div>)}</div>:<div><div className="flex-between"><span>⏱ {formatTime(examTime)}</span><span>{Object.keys(examAns).length}/{examDeck.length} answered</span></div>{examDeck.map((q,i)=><div key={i} className="card"><p><strong>{i+1}. {q.q}</strong></p><div className="grid-2">{q.opts.map((opt,j)=><button key={j} className="quiz-option" style={{background:examAns[i]===j?'#eff6ff':'white'}} onClick={()=>setExamAns({...examAns,[i]:j})}>{opt}</button>)}</div></div>)}<button style={{width:'100%',padding:'0.75rem',background:'#3b82f6',color:'white',border:'none',borderRadius:'0.5rem',marginTop:'0.5rem'}} onClick={submitExam}>Submit Exam</button></div>}</div>}
        {page==='clusters' && <div>{!clusterQuizActive ? <div><h1>Regents Practice Clusters</h1><p>10 NGSS-aligned question clusters covering all Regents topics. Each cluster has 5-6 practice questions.</p><div className="grid-2">{CLUSTERS.map(c=>{ let progress = (c.questions.filter((q,i)=>completed[`cluster-${c.id}-${i}`]).length / c.questions.length * 100) || 0; return <div key={c.id} className="card" style={{cursor:'pointer'}} onClick={()=>startClusterQuiz(c)}><h3>{c.title}</h3><p style={{fontSize:'0.8rem',color:'#90e0ef'}}>{c.description}</p><div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`, background:'#f59e0b'}}/></div><div className="flex-row" style={{justifyContent:'space-between',marginTop:'0.5rem'}}><span>{c.questions.length} questions</span><button className="card" style={{padding:'0.25rem 0.5rem',margin:0,fontSize:'0.7rem'}}>Start →</button></div></div>; })}</div></div>:clusterQuizDone?<div className="card text-center"><div style={{fontSize:'3rem'}}>{clusterQuizScore>=Math.floor(activeCluster.questions.length*0.7)?'🏆':'👍'}</div><h2>{clusterQuizScore}/{activeCluster.questions.length} correct</h2><p>+{clusterQuizScore*10+20} XP</p><button className="card" onClick={()=>setClusterQuizActive(false)}>Back to Clusters</button></div>:<div><div className="flex-between"><span>Q{clusterQuizIdx+1}/{activeCluster.questions.length}</span><span>✅ {clusterQuizScore}</span></div><div className="progress-bar"><div className="progress-fill" style={{width:`${(clusterQuizIdx/activeCluster.questions.length)*100}%`}}/></div><div className="card"><p style={{fontWeight:'bold'}}>{activeCluster.questions[clusterQuizIdx].q}</p><div className="grid-2">{activeCluster.questions[clusterQuizIdx].opts.map((opt,i)=><button key={i} className={`quiz-option ${clusterQuizSel!==null?(i===activeCluster.questions[clusterQuizIdx].ans?'correct':(i===clusterQuizSel?'wrong':'')):''}`} onClick={()=>handleClusterQuiz(i)} disabled={clusterQuizSel!==null}>{opt}</button>)}</div></div>{clusterQuizSel!==null && <div className={clusterQuizSel===activeCluster.questions[clusterQuizIdx].ans?'feedback-correct':'feedback-wrong'}><p>{clusterQuizSel===activeCluster.questions[clusterQuizIdx].ans?'✅ Correct!':'❌ Incorrect'}</p><p>{activeCluster.questions[clusterQuizIdx].exp}</p><button className="card" style={{marginTop:'0.5rem'}} onClick={nextClusterQuiz}>{clusterQuizIdx+1>=activeCluster.questions.length?'Results':'Next →'}</button></div>}</div>}</div>}
        {page==='reference' && <div><h1>Reference Tables</h1><div className="reference-table"><h2>Physical Constants</h2><table><thead><tr><th>Constant</th><th>Value</th><th>Description</th></tr></thead><tbody>{REFERENCE_DATA.constants.map(c=><tr key={c.name}><td>{c.name}</td><td>{c.value}</td><td>{c.description}</td></tr>)}</tbody></table><h2>SI Units</h2><table><thead><tr><th>Quantity</th><th>Unit</th><th>Equivalent</th></tr></thead><tbody>{REFERENCE_DATA.units.map(u=><tr key={u.quantity}><td>{u.quantity}</td><td>{u.unit}</td><td>{u.equivalent}</td></tr>)}</tbody></table><h2>Metric Prefixes</h2><table><thead><tr><th>Prefix</th><th>Factor</th><th>Meaning</th></tr></thead><tbody>{REFERENCE_DATA.prefixes.map(p=><tr key={p.prefix}><td>{p.prefix}</td><td>{p.factor}</td><td>{p.meaning}</td></tr>)}</tbody></table><h2>Common Conversions</h2><table><thead><tr><th>From</th><th>To</th><th>Description</th></tr></thead><tbody>{REFERENCE_DATA.conversions.map(c=><tr key={c.from}><td>{c.from}</td><td>{c.to}</td><td>{c.description}</td></tr>)}</tbody></table></div></div>}
        {page==='formulas' && <div><h1>Formula Reference</h1>{Object.values(UNITS).map(u=><div key={u.id}><h2 style={{color:u.color}}>{u.icon} {u.label}</h2><div className="grid-2">{u.topics.flatMap(t=>(t.formulas||[]).map((f,i)=><div key={`${u.id}-${i}`} className="card formula-card"><code dangerouslySetInnerHTML={{__html: f}} /><div className="meta" style={{fontSize:'0.7rem',color:'#90e0ef',marginTop:'0.25rem'}}>{t.title}</div></div>))}</div></div>)}</div>}
        {page==='ai-tutor' && <div><h1>Nova AI Tutor</h1><AITutor/></div>}
      </div></div>;
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
