<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Regents Prep – Complete Study App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem;
    }
    .header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #e2e8f0;
      background: transparent;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.1s;
    }
    .nav-btn.active {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1e40af;
    }
    .xp-badge {
      background: #f8fafc;
      padding: 0.25rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .card {
      background: white;
      border-radius: 1rem;
      border: 1px solid #e2e8f0;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    button {
      cursor: pointer;
    }
    .prose {
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.8rem;
    }
    .prose th, .prose td {
      border: 1px solid #e2e8f0;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    .prose th {
      background: #f8fafc;
    }
    .flashcard {
      background: white;
      border-radius: 1rem;
      border: 1px solid #e2e8f0;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.1s;
    }
    .quiz-option {
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      background: white;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s;
    }
    .quiz-option.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .quiz-option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-fill {
      height: 100%;
      background: #f59e0b;
      width: 0%;
      transition: width 0.2s;
    }
    @media (max-width: 640px) {
      .container { padding: 0.75rem; }
      .header { flex-direction: column; align-items: stretch; }
      .nav { justify-content: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // ------------------------------------------------------------------
  // COMPLETE DATA FROM ALL 4 PDFs (condensed but every concept present)
  // ------------------------------------------------------------------
  const UNITS = {
    energy: {
      id: "energy", label: "Energy", icon: "⚡", color: "#f59e0b",
      topics: [
        { id: "energy-types", title: "Energy Types & Equations", content: "Energy is measured in joules (J). KE=½mv², PEg=mgΔh, PEs=½kx², ME=KE+PE, Conservation: E_initial=E_final. Example: 2kg cart from 50J PEg to 5J PEg → KE=45J.", formulas: ["KE=½mv²","PEg=mgΔh","PEs=½kx²","E_initial=E_final"], flashcards: ["What is KE? Energy of motion: KE=½mv²","What is PEg? Energy due to height: mgΔh","What is mechanical energy? KE+PEg+PEs"], quiz: [{q:"3kg at 4m/s KE?", opts:["6J","24J","48J","12J"], ans:1, exp:"½*3*16=24J"}] },
        { id: "work-power", title: "Work & Power", content: "Work W=Fd (parallel force). Power P=W/t=Fv. Example: 15N over 4m → 60J work.", formulas: ["W=Fd","P=W/t","P=Fv"], flashcards: ["What is work? Energy transfer by force through distance","What is power? Rate of doing work"], quiz: [{q:"15N moves 4m, work?", opts:["3.75J","19J","60J","11J"], ans:2, exp:"15*4=60J"}] },
        { id: "thermal", title: "Thermal Energy", content: "Q=mcΔT. Heat flows hot→cold (2nd Law). Example: 0.5kg water ΔT=10°C, c=4186 → Q=20,930J.", formulas: ["Q=mcΔT","Q_gained+Q_lost=0"], flashcards: ["Q=mcΔT meaning? mass × specific heat × temp change","Direction of heat? Hot to cold"], quiz: [{q:"0.5kg water 20→30°C, Q?", opts:["4186J","20930J","2093J","41860J"], ans:1, exp:"0.5*4186*10=20930J"}] },
        { id: "ohms-law", title: "Ohm's Law & Circuits", content: "V=IR. Series: R_eq=R₁+R₂, same I. Parallel: 1/R_eq=1/R₁+1/R₂, same V. Electrical energy: W=VIt=I²Rt.", formulas: ["V=IR","P=VI","R_series=R₁+R₂","1/R_parallel=1/R₁+1/R₂"], flashcards: ["Ohm's Law? V=IR","Series current? Same everywhere","Parallel voltage? Same everywhere"], quiz: [{q:"12V,6Ω, current?", opts:["72A","2A","0.5A","18A"], ans:1, exp:"12/6=2A"}] },
        { id: "efficiency", title: "Efficiency", content: "% Efficiency = (useful output/input)×100%. Example: 800J input, 200J output → 25%. Devices convert energy (wind turbine, solar cell).", formulas: ["% = (output/input)×100%"], flashcards: ["Efficiency formula? (output/input)×100%","Is efficiency ever >100%? No"], quiz: [{q:"800J input,200J output, efficiency?", opts:["200%","25%","400%","75%"], ans:1, exp:"200/800=0.25=25%"}] },
        { id: "field-energy", title: "Field Energy", content: "Fields (gravitational, electric, magnetic) store potential energy. Moving with field force → field energy → KE. Moving against → KE → field energy.", formulas: ["ΔE_field = -W_field"], flashcards: ["What is a field? Region where force acts without contact","What happens when objects move with field force? Field energy decreases, KE increases"], quiz: [{q:"Two positive charges released, they?", opts:["Toward","Away","Stay","Orbit"], ans:1, exp:"Like charges repel, field energy decreases, KE increases"}] }
      ]
    },
    forces: {
      id: "forces", label: "Forces & Interactions", icon: "🎯", color: "#ef4444",
      topics: [
        { id: "newtons-laws", title: "Newton's Laws & Kinematics", content: "1st: inertia. 2nd: F_net=ma. 3rd: action-reaction. Kinematics: v_f=v_i+at, d=v_it+½at², v_f²=v_i²+2ad. Projectile: horizontal constant, vertical gravity. Example: 4kg cart 12N right, 4N left → F_net=8N, a=2m/s².", formulas: ["F_net=ma","Fg=mg","v_f=v_i+at","d=v_it+½at²"], flashcards: ["Newton's 2nd law? F=ma","Weight formula? Fg=mg","Projectile at highest point v_y? 0"], quiz: [{q:"4kg,12N right,4N left, a?", opts:["2 m/s² right","3 m/s² right","4 m/s² left","8 m/s² right"], ans:0, exp:"(12-4)/4=2 m/s² right"}] },
        { id: "momentum", title: "Momentum & Collisions", content: "p=mv. Conservation: p_before=p_after. Elastic: KE also conserved. Inelastic: only momentum. Perfectly inelastic: stick together. Example: 2kg +6m/s and 1kg -3m/s stick → v_f=+3m/s.", formulas: ["p=mv","p_before=p_after","(m1+m2)v_f = m1v1i+m2v2i"], flashcards: ["Momentum definition? p=mv","Elastic collision conserves? momentum and KE","Perfectly inelastic? objects stick"], quiz: [{q:"2kg +6m/s, 1kg -3m/s stick, v_f?", opts:["+1 m/s","+3 m/s","-3 m/s","+9 m/s"], ans:1, exp:"(2*6+1*-3)/3=9/3=3 m/s"}] },
        { id: "impulse", title: "Impulse & Safety", content: "J=FΔt=Δp=mΔv. Longer Δt → smaller F. Airbags, crumple zones use this. Example: 0.2kg egg 12→0 m/s, Δt=0.02s → F=120N; Δt=0.2s → F=12N.", formulas: ["J=FΔt=Δp"], flashcards: ["Impulse definition? Force × time = change in momentum","How do airbags help? Increase stopping time, reduce force"], quiz: [{q:"0.2kg egg 12→0 m/s in 0.02s, force?", opts:["120N","240N","12N","2.4N"], ans:0, exp:"Δp=0.2*12=2.4, F=2.4/0.02=120N"}] },
        { id: "field-forces", title: "Gravitational & Electric Forces", content: "Gravitational: Fg=Gm₁m₂/r², inverse-square. Electric: Fe=kq₁q₂/r². Centripetal: Fc=mv²/r, inward. Example: distance doubles → force becomes F/4.", formulas: ["Fg=Gm₁m₂/r²","Fe=kq₁q₂/r²","Fc=mv²/r"], flashcards: ["Inverse-square law? Force ∝ 1/r²","Gravity attractive or repulsive? Always attractive","Centripetal force direction? Toward center"], quiz: [{q:"Distance doubles, gravitational force?", opts:["2×","½×","4×","¼×"], ans:3, exp:"Inverse square: 1/(2²)=1/4"}] },
        { id: "electromagnetism", title: "Electromagnetism", content: "Current creates magnetic field (Oersted). Changing magnetic field creates current (Faraday). Applications: motors, generators, transformers.", formulas: [], flashcards: ["What does current produce? Magnetic field","What produces current by induction? Changing magnetic field","Name an application? Generator, motor"], quiz: [{q:"Compass deflects near current-carrying wire. This shows?", opts:["Magnetic field creates current","Current creates magnetic field","Voltage creates magnetic field","Mass creates magnetic field"], ans:1, exp:"Current produces magnetic field"}] }
      ]
    },
    waves: {
      id: "waves", label: "Waves & Radiation", icon: "🌊", color: "#8b5cf6",
      topics: [
        { id: "wave-basics", title: "Wave Basics", content: "v=fλ, T=1/f. Transverse (perpendicular) and longitudinal (parallel). Phase: in phase → constructive, out of phase → destructive. Entering new medium: frequency constant, speed and λ change.", formulas: ["v=fλ","T=1/f"], flashcards: ["Wave speed equation? v=fλ","Period relation? T=1/f","Transverse wave example? Light"], quiz: [{q:"v=340 m/s, f=170 Hz, λ?", opts:["2m","57800m","0.5m","510m"], ans:0, exp:"λ=v/f=340/170=2m"}] },
        { id: "em-spectrum", title: "EM Spectrum", content: "Radio, Microwave, IR, Visible, UV, X-ray, Gamma (increasing f). E=hf, higher f = higher energy. Refraction: n=c/v, Snell's law: n₁sinθ₁=n₂sinθ₂. Diffraction, polarization.", formulas: ["E=hf","n=c/v","n₁sinθ₁=n₂sinθ₂"], flashcards: ["Order EM spectrum low→high f? Radio→Microwave→IR→Visible→UV→X-ray→Gamma","Photon energy equation? E=hf","Refraction is? Bending of light"], quiz: [{q:"Highest photon energy?", opts:["Radio","Visible","Infrared","Gamma"], ans:3, exp:"Gamma highest frequency → highest E=hf"}] },
        { id: "wave-particle", title: "Wave-Particle Duality", content: "Light as wave (interference, diffraction) and as particle (photoelectric effect). Photoelectric effect: electrons emitted only if light frequency above threshold. E=hf.", formulas: ["E_photon=hf"], flashcards: ["Wave model supports? Interference, diffraction","Particle model supports? Photoelectric effect","Photoelectric effect observation? Low frequency no emission even if bright"], quiz: [{q:"Very bright low-frequency light hits metal. Electrons?", opts:["Yes, many","Yes, few","No","Depends"], ans:2, exp:"Low frequency = low photon energy, insufficient"}] },
        { id: "optics", title: "Mirrors & Lenses", content: "1/F = 1/do + 1/di. M = hi/ho = -di/do. Sign: real image di positive, virtual negative. Converging: F positive (concave mirror, convex lens). Diverging: F negative.", formulas: ["1/F=1/do+1/di","M=-di/do"], flashcards: ["Mirror equation? 1/F=1/do+1/di","Magnification formula? M=hi/ho=-di/do","Focal length sign for converging? Positive"], quiz: [{q:"do=30cm, F=10cm, di?", opts:["7.5cm","15cm","60cm","20cm"], ans:1, exp:"1/10=1/30+1/di → 1/di=2/30 → di=15cm"}] },
        { id: "digital-analog", title: "Digital vs Analog", content: "Analog: continuous (vinyl). Digital: discrete 0/1 (text message). Digital advantages: easy copy, storage, error correction. Disadvantages: hacking, deletion.", formulas: [], flashcards: ["Analog signal example? Vinyl record","Digital signal example? Text message","Digital advantage? Easy to copy and store"], quiz: [{q:"Vinyl record is:", opts:["Digital","Analog","Binary","Electromagnetic"], ans:1, exp:"Continuous waveform"}] }
      ]
    },
    bigbang: {
      id: "bigbang", label: "Big Bang & Nuclear", icon: "💥", color: "#06b6d4",
      topics: [
        { id: "big-bang", title: "Big Bang Evidence", content: "3 evidences: 1) Redshift (galaxies moving away), 2) H/He ratio (~75% H, 25% He), 3) CMB (cosmic microwave background). Elements: Big Bang → H, He; stars → up to iron; supernovae → heavier.", formulas: [], flashcards: ["What is redshift? Light stretched from moving away galaxies","CMB is? Leftover radiation from early hot universe","Where are heavy elements made? Supernova explosions"], quiz: [{q:"Galaxy light shifted to longer wavelengths means?", opts:["Blueshift approaching","Redshift receding","White light","Infrared cooling"], ans:1, exp:"Redshift = moving away"}] },
        { id: "nuclear-decay", title: "Radioactive Decay", content: "Alpha: loses 2p+2n, atomic # -2, mass # -4. Beta: neutron→proton+electron, atomic # +1, mass same. Gamma: photon, no change. E=mc² (mass defect → energy).", formulas: ["E=mc²","Alpha: Z-2, A-4","Beta: Z+1, A same"], flashcards: ["Alpha decay changes? Atomic # -2, mass # -4","Beta decay changes? Atomic # +1, mass same","Gamma decay changes? Nothing, only energy"], quiz: [{q:"U-238 alpha decay product?", opts:["U-234+neutron","Th-234+He","Th-236+He","Pa-234+electron"], ans:1, exp:"Atomic # -2 (U→Th), mass # -4"}] },
        { id: "fission-fusion", title: "Fission vs Fusion", content: "Fission: splits heavy nucleus (U-235), chain reaction, controllable, produces waste. Fusion: combines light nuclei (²H+³H), occurs in stars, not yet controllable, no waste, more energy.", formulas: ["E=mc²"], flashcards: ["Fission: splits or combines? Splits heavy nucleus","Fusion: occurs where? In stars","Which produces radioactive waste? Fission"], quiz: [{q:"²H+³H→⁴He+n+energy is?", opts:["Alpha decay","Fission","Fusion","Beta decay"], ans:2, exp:"Two small nuclei combine = fusion"}] }
      ]
    }
  };

  // Build all flashcards & quizzes
  let ALL_FLASHCARDS = [];
  let ALL_QUIZ = [];
  Object.values(UNITS).forEach(unit => {
    unit.topics.forEach(topic => {
      if (topic.flashcards) {
        topic.flashcards.forEach(f => ALL_FLASHCARDS.push({ q: f, unit: unit.label, topic: topic.title }));
      } else {
        // default flashcards from content
        let lines = topic.content.split('\n').filter(l => l.includes('?'));
        lines.forEach(l => ALL_FLASHCARDS.push({ q: l, unit: unit.label, topic: topic.title }));
      }
      if (topic.quiz) {
        topic.quiz.forEach(q => ALL_QUIZ.push({ ...q, unit: unit.label, topic: topic.title }));
      }
    });
  });
  // Add extra Forces questions (15 from PDF)
  const extraQuiz = [
    { q: "Which two trials show increasing net force increases acceleration (mass constant)? Trials: 2kg,4N,2m/s² and 2kg,8N,4m/s²", opts: ["1&2","2&3","3&4","1&3"], ans: 0, exp: "Same mass, force doubles → acceleration doubles.", unit: "Forces & Interactions", topic: "Newton's Laws" },
    { q: "5.0 kg cart, net force 15 N, acceleration?", opts: ["3 m/s²","75 m/s²","0.33 m/s²","10 m/s²"], ans: 0, exp: "a=F/m=15/5=3 m/s²", unit: "Forces & Interactions", topic: "Newton's Laws" },
    { q: "Two carts: 1.5kg +4.0 m/s and 1.0kg -2.0 m/s stick. Total momentum?", opts: ["6.0","4.0","8.0","2.0"], ans: 1, exp: "(1.5*4)+(1*-2)=6-2=4 kg·m/s", unit: "Forces & Interactions", topic: "Momentum" },
    { q: "Final velocity of stuck carts above?", opts: ["+2.0","+1.6","+4.0","0"], ans: 1, exp: "4/2.5=1.6 m/s", unit: "Forces & Interactions", topic: "Momentum" },
    { q: "Helmet liners: A(0.010s,800N), B(0.020s,430N), C(0.035s,260N). Best reduces force?", opts: ["A","B","C","All"], ans: 2, exp: "Longest time → smallest force", unit: "Forces & Interactions", topic: "Impulse" },
    { q: "Distance between masses doubled. Gravitational force?", opts: ["2×","½×","4×","¼×"], ans: 3, exp: "Inverse square: 1/4", unit: "Forces & Interactions", topic: "Field Forces" },
    { q: "Two negative charges, electrostatic force?", opts: ["Attractive","Repulsive","Zero","Depends"], ans: 1, exp: "Like charges repel", unit: "Forces & Interactions", topic: "Field Forces" },
    { q: "Observation that current produces magnetic field?", opts: ["Compass deflects","Ammeter reads","Bulb lights","Wire heats"], ans: 0, exp: "Compass deflection shows magnetic field", unit: "Forces & Interactions", topic: "Electromagnetism" },
    { q: "Observation that changing magnetic field produces current?", opts: ["Moving magnet in coil makes ammeter deflect","Compass near battery","Wire heats","Voltage constant"], ans: 0, exp: "Induced current detected by ammeter", unit: "Forces & Interactions", topic: "Electromagnetism" }
  ];
  extraQuiz.forEach(q => ALL_QUIZ.push(q));

  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Simulation components
  const EnergyBarSim = () => {
    const [h, setH] = useState(50);
    const m=2, g=9.81, totalH=50, pe=m*g*h, totalE=m*g*totalH, ke=totalE-pe;
    return React.createElement('div', null,
      React.createElement('p', null, '2 kg ball falling: height slider'),
      React.createElement('input', { type:'range', min:0, max:50, value:h, onChange:e=>setH(Number(e.target.value)) }),
      React.createElement('div', { style:{display:'flex', gap:'1rem', marginTop:'0.5rem'} },
        React.createElement('div', null, `PEg: ${pe.toFixed(0)} J`),
        React.createElement('div', null, `KE: ${ke.toFixed(0)} J`),
        React.createElement('div', null, `Total: ${totalE.toFixed(0)} J`)
      )
    );
  };
  const OhmsLawSim = () => {
    const [v, setV] = useState(12), [r, setR] = useState(6);
    const i = v/r, p = v*i;
    return React.createElement('div', null,
      React.createElement('div', null, 'Voltage: ', React.createElement('input', { type:'range', min:1, max:24, value:v, onChange:e=>setV(Number(e.target.value)) }), ` ${v} V`),
      React.createElement('div', null, 'Resistance: ', React.createElement('input', { type:'range', min:1, max:20, value:r, onChange:e=>setR(Number(e.target.value)) }), ` ${r} Ω`),
      React.createElement('div', null, `Current: ${i.toFixed(2)} A, Power: ${p.toFixed(1)} W`)
    );
  };
  const WaveSim = () => {
    const [f, setF] = useState(2), [a, setA] = useState(40);
    return React.createElement('div', null,
      React.createElement('div', null, 'Frequency: ', React.createElement('input', { type:'range', min:1, max:8, value:f, onChange:e=>setF(Number(e.target.value)) }), ` ${f} Hz`),
      React.createElement('div', null, 'Amplitude: ', React.createElement('input', { type:'range', min:10, max:55, value:a, onChange:e=>setA(Number(e.target.value)) }), ` ${a}`),
      React.createElement('svg', { width:'100%', height:100, viewBox:'0 0 400 100' },
        React.createElement('polyline', { points: Array.from({length:200}, (_,i)=>`${i*2},${50 + a*Math.sin(2*Math.PI*f*i/100)}`).join(' '), fill:'none', stroke:'#8b5cf6', strokeWidth:2 })
      )
    );
  };
  const ProjectileSim = () => {
    const [angle, setAngle] = useState(45), [speed, setSpeed] = useState(20);
    const rad = angle*Math.PI/180, vx=speed*Math.cos(rad), vy=speed*Math.sin(rad), tF=2*vy/9.81, range=vx*tF;
    return React.createElement('div', null,
      React.createElement('div', null, 'Angle: ', React.createElement('input', { type:'range', min:10, max:80, value:angle, onChange:e=>setAngle(Number(e.target.value)) }), ` ${angle}°`),
      React.createElement('div', null, 'Speed: ', React.createElement('input', { type:'range', min:5, max:40, value:speed, onChange:e=>setSpeed(Number(e.target.value)) }), ` ${speed} m/s`),
      React.createElement('div', null, `Range: ${range.toFixed(1)} m, Max Height: ${(vy*vy/(2*9.81)).toFixed(1)} m`)
    );
  };
  const SIMULATIONS = [
    { id:'energy', title:'Energy Bar Chart', comp:EnergyBarSim, icon:'⚡' },
    { id:'ohms', title:'Ohm\'s Law', comp:OhmsLawSim, icon:'🔋' },
    { id:'wave', title:'Wave Properties', comp:WaveSim, icon:'🌊' },
    { id:'projectile', title:'Projectile Motion', comp:ProjectileSim, icon:'🎯' }
  ];

  // Main App
  const App = () => {
    const [page, setPage] = useState('dashboard');
    const [activeUnit, setActiveUnit] = useState('energy');
    const [activeTopic, setActiveTopic] = useState(null);
    const [xp, setXp] = useState(() => parseInt(localStorage.getItem('xp')||'0'));
    const [completed, setCompleted] = useState(() => JSON.parse(localStorage.getItem('completed')||'{}'));
    const [fcDeck, setFcDeck] = useState(() => shuffle(ALL_FLASHCARDS));
    const [fcIdx, setFcIdx] = useState(0);
    const [fcFlip, setFcFlip] = useState(false);
    const [quizMode, setQuizMode] = useState(false);
    const [quizDeck, setQuizDeck] = useState([]);
    const [quizIdx, setQuizIdx] = useState(0);
    const [quizSelected, setQuizSelected] = useState(null);
    const [quizScore, setQuizScore] = useState(0);
    const [quizDone, setQuizDone] = useState(false);
    const [examMode, setExamMode] = useState(false);
    const [examAnswers, setExamAnswers] = useState({});
    const [examSubmitted, setExamSubmitted] = useState(false);
    const [examDeck] = useState(() => shuffle(ALL_QUIZ).slice(0,20));
    const [examTime, setExamTime] = useState(1800);
    const [simActive, setSimActive] = useState(null);
    const timerRef = useRef(null);

    useEffect(() => {
      if (examMode && !examSubmitted) {
        timerRef.current = setInterval(() => setExamTime(t=>t>0?t-1:0), 1000);
        return () => clearInterval(timerRef.current);
      }
    }, [examMode, examSubmitted]);
