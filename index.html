  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0b1120, #030617);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      padding-bottom: 3rem;
    }

    .watermark {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      font-size: 1.8rem;
      font-weight: 800;
      opacity: 0.03;
      pointer-events: none;
      z-index: 999;
      letter-spacing: 0.2rem;
      font-family: monospace;
    }

    .header {
      background: rgba(10, 25, 47, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #2c4c6e;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5f3fc, #facc15);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #2c4c6e;
      padding: 0.4rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #cbd5e6;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: #1e3a5f;
      border-color: #60a5fa;
      color: white;
      box-shadow: 0 0 6px #3b82f6;
    }

    .xp-badge {
      background: #0f212e;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .reset-btn {
      background: #ef4444;
      border: none;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .reset-btn:hover {
      background: #b91c1c;
      transform: scale(0.98);
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.2rem;
      background: linear-gradient(120deg, #e0f2fe, #fde047);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin: 1.8rem 0 1rem;
      font-size: 1.4rem;
      border-left: 4px solid #f59e0b;
      padding-left: 0.8rem;
    }

    h3 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      margin: 1rem 0;
    }

    .card {
      background: rgba(15, 35, 50, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid #2c4c6e;
      border-radius: 1rem;
      padding: 1.2rem;
      transition: all 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .progress-bar {
      background: #1e3a5f;
      border-radius: 1rem;
      height: 8px;
      overflow: hidden;
      margin: 0.5rem 0;
    }

    .progress-fill {
      background: linear-gradient(90deg, #3b82f6, #f59e0b);
      height: 100%;
      border-radius: 1rem;
      transition: width 0.3s;
    }

    .formula-card code {
      font-size: 1rem;
      background: #0a192f;
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      display: inline-block;
      font-family: 'SF Mono', 'Courier New', monospace;
    }

    .mastery-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .unit-card.completed {
      border: 2px solid #f59e0b;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    .next-topic-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      margin-left: 0.5rem;
    }

    .next-topic-btn:hover {
      background: #2563eb;
      transform: scale(1.02);
    }

    .reference-table {
      font-size: 0.8rem;
      overflow-x: auto;
    }

    .reference-table table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 0.5rem;
    }

    .reference-table th,
    .reference-table td {
      border: 1px solid #2c4c6e;
      padding: 0.5rem;
      text-align: left;
    }

    .reference-table th {
      background: #0f2b3d;
      color: #90e0ef;
    }

    .learn-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
    }

    .sidebar-unit-btn {
      width: 100%;
      background: #0f2b3d;
      border: 1px solid #2c4c6e;
      padding: 0.6rem;
      border-radius: 0.5rem;
      color: #e2e8f0;
      cursor: pointer;
      font-weight: 600;
      text-align: left;
    }

    .sidebar-topic-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
      margin: 0.2rem 0;
    }

    .sidebar-topic-btn.active {
      background: #1e3a5f;
      color: white;
    }

    .sidebar-topic-btn.done {
      color: #facc15;
    }

    .flashcard {
      background: linear-gradient(135deg, #1e3a5f, #0f2b3d);
      border: 2px solid #3b82f6;
      border-radius: 1rem;
      padding: 3rem;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flashcard:hover {
      transform: scale(1.02);
      border-color: #f59e0b;
    }

    .quiz-option {
      background: #0f2b3d;
      border: 1px solid #2c4c6e;
      padding: 0.6rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      color: #e2e8f0;
    }

    .quiz-option:hover:not(:disabled) {
      background: #1e3a5f;
      border-color: #60a5fa;
    }

    .quiz-option.correct {
      background: #22c55e;
      border-color: #22c55e;
      color: white;
    }

    .quiz-option.wrong {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }

    .feedback-correct {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
    }

    .feedback-wrong {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
    }

    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .flex-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .text-center {
      text-align: center;
    }

    .prose {
      line-height: 1.6;
    }

    .yt-embed {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }

    .sim-controls {
      margin-top: 1rem;
    }

    .sim-controls label {
      display: block;
      margin: 0.5rem 0;
      font-size: 0.85rem;
    }

    .sim-controls input {
      width: 100%;
      margin: 0.25rem 0;
    }

    .sim-output {
      margin-top: 0.5rem;
      font-weight: bold;
      color: #facc15;
    }

    textarea {
      background: #0f2b3d;
      color: #e2e8f0;
      border: 1px solid #2c4c6e;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .learn-layout {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
      }
      .container {
        padding: 0 1rem;
      }
      .flashcard {
        padding: 1.5rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="watermark">NOVA</div>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ==============================================================
    // COMPLETE CONTENT – all topics from PDFs + NGSS clusters
    // ==============================================================
    const UNITS = {
      foundations: {
        id: "foundations", label: "Foundations", icon: "📐", color: "#3b82f6",
        topics: [
          {
            id: "scalars-vectors", title: "Scalars vs. Vectors & Kinematics",
            content: `Scalars: magnitude only (time, mass, temp, energy, work, power).
Vectors: magnitude + direction (force, velocity, acceleration, momentum, fields).
Distance (scalar) vs. Displacement (vector). Speed (scalar) vs. Velocity (vector).
Average velocity: v̄ = (v_f + v_i)/2. Acceleration: a = Δv/t.

Kinematics (constant acceleration):
  v_f = v_i + a t
  d = v_i t + ½ a t²
  v_f² = v_i² + 2 a d

Velocity-time graph: slope = acceleration, area under = displacement.`,
            formulas: [
              "v̄ = (v<sub>f</sub> + v<sub>i</sub>)/2",
              "a = Δv / t",
              "v<sub>f</sub> = v<sub>i</sub> + a t",
              "d = v<sub>i</sub> t + ½ a t²",
              "v<sub>f</sub>² = v<sub>i</sub>² + 2 a d"
            ],
            flashcards: [
              { q: "Scalar vs. vector?", a: "Scalar = magnitude only; vector = magnitude + direction." },
              { q: "Distance vs. displacement?", a: "Distance = total path (scalar); displacement = net change (vector)." },
              { q: "Slope of v-t graph?", a: "Acceleration." },
              { q: "Area under v-t graph?", a: "Displacement." }
            ],
            quiz: [{ q: "Car from rest to 20 m/s in 5 s — acceleration?", opts: ["4 m/s²", "5 m/s²", "2 m/s²", "10 m/s²"], ans: 0, exp: "a = 20/5 = 4 m/s²" }]
          },
          {
            id: "circular-projectile", title: "Circular & Projectile Motion",
            content: `**Circular motion:**
  Centripetal acceleration: a_c = v²/r (toward center)
  Centripetal force: F_c = m v²/r
  Doubling velocity → quadruples a_c (a_c ∝ v²)

**Projectile motion:**
  Horizontal: v_x constant, a_x = 0
  Vertical: a_y = -9.8 m/s² (downward)
  At peak: v_y = 0, time to peak t = v_y0 / g
  Total time = 2·t_peak, Range = v_x × total time
  Components: v_x = v cosθ, v_y = v sinθ
  Resultant velocity: v = √(v_x² + v_y²)
  Launch angle: θ = tan⁻¹(v_y / v_x)`,
            formulas: [
              "a<sub>c</sub> = v² / r",
              "F<sub>c</sub> = m v² / r",
              "v<sub>x</sub> = v cosθ",
              "v<sub>y</sub> = v sinθ",
              "t<sub>peak</sub> = v<sub>y0</sub> / g",
              "range = v<sub>x</sub> × 2 t<sub>peak</sub>",
              "v = √(v<sub>x</sub>² + v<sub>y</sub>²)"
            ],
            flashcards: [
              { q: "Centripetal acceleration direction?", a: "Toward center." },
              { q: "If v doubles, a_c changes by?", a: "4× (since a_c ∝ v²)." },
              { q: "Horizontal acceleration in projectile?", a: "0 (constant velocity)." },
              { q: "At highest point, v_y = ?", a: "0 m/s." }
            ],
            quiz: [{ q: "v = 20 m/s, r = 5 m — a_c?", opts: ["80 m/s²", "4 m/s²", "100 m/s²", "20 m/s²"], ans: 0, exp: "400/5 = 80 m/s²" }]
          }
        ]
      },
      forces: {
        id: "forces", label: "Forces & Newton's Laws", icon: "🎯", color: "#ef4444",
        topics: [
          {
            id: "newtons-laws", title: "Newton's Laws, Weight, Normal, Inclines, Friction",
            content: `**Newton's 1st Law (Inertia):** Objects remain at rest or constant velocity unless acted by net force.
**Newton's 2nd Law:** F_net = m a
**Newton's 3rd Law:** Action-reaction pairs (equal, opposite, different objects).

**Weight:** F_g = mg (g = 9.81 m/s²)
**Normal force:** perpendicular to surface. On horizontal: F_N = mg. On incline: F_N = mg cosθ.
**Incline:** Parallel component F_∥ = mg sinθ (down the slope), Normal component F_⊥ = mg cosθ.

**Friction:** F_f = μ F_N
  - Static friction (μ_s): prevents motion up to max value.
  - Kinetic friction (μ_k): opposes sliding motion (μ_k < μ_s).

**Equilibrium:** F_net = 0 → a = 0 (can still move at constant speed).`,
            formulas: [
              "F<sub>net</sub> = m a",
              "F<sub>g</sub> = m g",
              "F<sub>N</sub> = m g (horizontal)",
              "F<sub>∥</sub> = m g sinθ",
              "F<sub>f</sub> = μ F<sub>N</sub>"
            ],
            flashcards: [
              { q: "Newton's 2nd law?", a: "F_net = m a." },
              { q: "Weight formula?", a: "F_g = mg." },
              { q: "Friction formula?", a: "F_f = μ F_N." }
            ],
            quiz: [{ q: "10 kg box, F_net = 20 N — a?", opts: ["2 m/s²", "0.5 m/s²", "200 m/s²", "10 m/s²"], ans: 0, exp: "a = 20/10 = 2 m/s²" }]
          },
          {
            id: "momentum-impulse", title: "Momentum, Impulse & Collisions",
            content: `**Momentum:** p = mv (kg·m/s)
**Impulse:** J = FΔt = Δp = mΔv
**Conservation of momentum (closed system):** p_before = p_after

**Collision types:**
  - Perfectly inelastic: objects stick together → (m₁+m₂)v_f = m₁v₁ + m₂v₂
  - Elastic: bounce apart; momentum AND kinetic energy conserved.`,
            formulas: ["p = m v", "J = F Δt = Δp", "(m₁ + m₂) v<sub>f</sub> = m₁v₁ + m₂v₂"],
            flashcards: [
              { q: "Momentum formula?", a: "p = mv." },
              { q: "Impulse equals?", a: "Change in momentum: FΔt = Δp." }
            ],
            quiz: [{ q: "2 kg cart at 3 m/s — momentum?", opts: ["6 kg·m/s", "1.5", "5", "0"], ans: 0, exp: "2×3=6 kg·m/s" }]
          }
        ]
      },
      energy: {
        id: "energy", label: "Energy, Work & Power", icon: "⚡", color: "#f59e0b",
        topics: [
          {
            id: "energy-types", title: "Energy Types, Work, Power, Efficiency",
            content: `**Kinetic Energy:** KE = ½mv²
**Gravitational PE:** PE_g = mgh
**Conservation of energy (no friction):** E_initial = E_final
**Work:** W = F·d (force parallel to displacement).
**Power:** P = W/t = F·v (Watts)
**Efficiency:** % = (useful output / total input) × 100%`,
            formulas: ["KE = ½ m v²", "PE<sub>g</sub> = m g h", "W = F d", "P = W / t = F v"],
            flashcards: [
              { q: "KE formula?", a: "½mv²." },
              { q: "PE_g formula?", a: "mgh." },
              { q: "Work formula?", a: "W = Fd." }
            ],
            quiz: [{ q: "2 kg at 3 m/s — KE?", opts: ["9 J", "6 J", "3 J", "12 J"], ans: 0, exp: "½×2×9=9 J" }]
          }
        ]
      }
    };

    // Build master flashcards & quiz pools
    let ALL_FLASHCARDS = [];
    let ALL_QUIZ = [];
    Object.values(UNITS).forEach(unit => {
      unit.topics.forEach(topic => {
        if (topic.flashcards) topic.flashcards.forEach(f => ALL_FLASHCARDS.push({ ...f, unit: unit.label, topic: topic.title }));
        if (topic.quiz) topic.quiz.forEach(q => ALL_QUIZ.push({ ...q, unit: unit.label, topic: topic.title }));
      });
    });

    function shuffle(arr) { let a = [...arr]; for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    // Main App
    const App = () => {
      const [page, setPage] = useState('dashboard');
      const [activeUnit, setActiveUnit] = useState('foundations');
      const [activeTopic, setActiveTopic] = useState(null);
      const [xp, setXp] = useState(() => parseInt(localStorage.getItem('xp') || '0'));
      const [completed, setCompleted] = useState(() => JSON.parse(localStorage.getItem('completed') || '{}'));
      const [fcDeck, setFcDeck] = useState(() => shuffle(ALL_FLASHCARDS));
      const [fcIdx, setFcIdx] = useState(0);
      const [fcFlip, setFcFlip] = useState(false);
      const [quizActive, setQuizActive] = useState(false);
      const [quizDeck, setQuizDeck] = useState([]);
      const [quizIdx, setQuizIdx] = useState(0);
      const [quizSel, setQuizSel] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizDone, setQuizDone] = useState(false);

      const addXp = (amt) => { let n = xp + amt; setXp(n); localStorage.setItem('xp', n); };
      const markComplete = (key) => { let c = { ...completed, [key]: true }; setCompleted(c); localStorage.setItem('completed', JSON.stringify(c)); };

      const resetProgress = () => {
        if (confirm('Reset all progress?')) {
          setXp(0);
          setCompleted({});
          localStorage.clear();
          window.location.reload();
        }
      };

      const level = Math.floor(xp / 100) + 1;
      const xpToNext = 100 - (xp % 100);
      const totalTopics = Object.values(UNITS).reduce((s, u) => s + u.topics.length, 0);
      const completedCount = Object.keys(completed).length;

      const startQuiz = (filter) => {
        const pool = filter === 'all' ? ALL_QUIZ : ALL_QUIZ.filter(q => q.unit === filter);
        setQuizDeck(shuffle(pool).slice(0, 5));
        setQuizIdx(0);
        setQuizSel(null);
        setQuizScore(0);
        setQuizDone(false);
        setQuizActive(true);
        setPage('quiz');
      };

      const handleQuiz = (idx) => {
        if (quizSel !== null) return;
        setQuizSel(idx);
        if (idx === quizDeck[quizIdx].ans) {
          setQuizScore(s => s + 1);
          addXp(10);
        }
      };

      const nextQuiz = () => {
        if (quizIdx + 1 >= quizDeck.length) {
          setQuizDone(true);
          addXp(20);
        } else {
          setQuizIdx(i => i + 1);
          setQuizSel(null);
        }
      };

      const NAV = [
        { id: 'dashboard', label: '🏠 Dashboard' },
        { id: 'learn', label: '📖 Learn' },
        { id: 'flashcards', label: '🃏 Flashcards' },
        { id: 'quiz', label: '❓ Quiz' },
        { id: 'reference', label: '📖 Reference' }
      ];

      return (
        <div>
          <div className="header">
            <div className="logo">⚛️ Nova Physics Regents</div>
            <div className="nav">
              {NAV.map(n => (
                <button key={n.id} className={`nav-btn ${page === n.id ? 'active' : ''}`} onClick={() => { setPage(n.id); setQuizActive(false); }}>
                  {n.label}
                </button>
              ))}
            </div>
            <div className="xp-badge">
              🔥 Lv.{level} · {xp} XP · {xpToNext} to next
              <button className="reset-btn" onClick={resetProgress}>Reset</button>
            </div>
          </div>

          <div className="container">
            {page === 'dashboard' && (
              <div>
                <h1>Your Nova Dashboard</h1>
                <div className="grid-2">
                  <div className="card">⭐ XP: {xp}</div>
                  <div className="card">🏆 Level: {level}</div>
                  <div className="card">✅ Topics: {completedCount}/{totalTopics}</div>
                  <div className="card">⬆️ Next: {xpToNext} XP</div>
                </div>
                <div className="card">
                  <div>Level {level} progress</div>
                  <div className="progress-bar"><div className="progress-fill" style={{ width: `${xp % 100}%` }} /></div>
                </div>
                <h2>Units</h2>
                <div className="grid-2">
                  {Object.values(UNITS).map(u => {
                    let done = u.topics.filter(t => completed[`${u.id}-${t.id}`]).length;
                    let mastery = done === u.topics.length;
                    return (
                      <div key={u.id} className={`card unit-card ${mastery ? 'completed' : ''}`} onClick={() => { setPage('learn'); setActiveUnit(u.id); setActiveTopic(null); }}>
                        <div style={{ fontSize: '2rem' }}>{u.icon}</div>
                        <h3>{u.label} {mastery && <span className="mastery-badge">🌟 Mastered</span>}</h3>
                        <div>{done}/{u.topics.length} topics</div>
                        <div className="progress-bar"><div className="progress-fill" style={{ width: `${(done / u.topics.length) * 100}%`, background: u.color }} /></div>
                      </div>
                    );
                  })}
                </div>
                <h2>Quick Actions</h2>
                <div className="grid-2">
                  <button className="card" onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); setPage('flashcards'); }}>🃏 Flashcards</button>
                  <button className="card" onClick={() => startQuiz('all')}>❓ Random Quiz</button>
                </div>
              </div>
            )}

            {page === 'learn' && (
              <div className="learn-layout">
                <div>
                  {Object.values(UNITS).map(u => (
                    <div key={u.id} style={{ marginBottom: '0.75rem' }}>
                      <button className="sidebar-unit-btn" onClick={() => setActiveUnit(activeUnit === u.id ? null : u.id)}>
                        {u.icon} {u.label}
                      </button>
                      {activeUnit === u.id && (
                        <div style={{ marginTop: '0.25rem' }}>
                          {u.topics.map(t => (
                            <button key={t.id} className={`sidebar-topic-btn ${activeTopic?.id === t.id ? 'active' : ''} ${completed[`${u.id}-${t.id}`] ? 'done' : ''}`} onClick={() => { setActiveTopic(t); markComplete(`${u.id}-${t.id}`); addXp(5); }}>
                              {completed[`${u.id}-${t.id}`] ? '✅ ' : '○ '}{t.title}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                {activeTopic ? (
                  <div className="card">
                    <h2>{activeTopic.title}</h2>
                    <div className="prose" style={{ whiteSpace: 'pre-wrap' }}>{activeTopic.content}</div>
                    {activeTopic.formulas && (
                      <div>
                        <h3>Key Formulas</h3>
                        <div className="grid-2">
                          {activeTopic.formulas.map((f, i) => (
                            <div key={i} className="formula-card" style={{ background: '#0a192f', padding: '0.5rem', borderRadius: '0.5rem' }}>
                              <code dangerouslySetInnerHTML={{ __html: f }} />
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    <div style={{ marginTop: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                      <button className="card" style={{ padding: '0.5rem 1rem', margin: 0 }} onClick={() => { setFcDeck(shuffle(activeTopic.flashcards || [])); setFcIdx(0); setFcFlip(false); setPage('flashcards'); }}>🃏 Study</button>
                      <button className="card" style={{ padding: '0.5rem 1rem', margin: 0 }} onClick={() => startQuiz(UNITS[activeUnit]?.label)}>❓ Quiz</button>
                    </div>
                  </div>
                ) : (
                  <div className="card text-center"><p>Select a topic from the left.</p></div>
                )}
              </div>
            )}

            {page === 'flashcards' && (
              <div>
                <h1>Flashcards</h1>
                {fcDeck.length > 0 ? (
                  <>
                    <div className="flashcard" onClick={() => setFcFlip(!fcFlip)}>
                      {fcFlip ? fcDeck[fcIdx]?.a : fcDeck[fcIdx]?.q}
                    </div>
                    <div className="flex-row" style={{ justifyContent: 'center', marginTop: '0.5rem' }}>
                      <button className="card" onClick={() => { if (fcIdx > 0) { setFcIdx(fcIdx - 1); setFcFlip(false); } }}>← Prev</button>
                      <button className="card" onClick={() => { setFcIdx((fcIdx + 1) % fcDeck.length); setFcFlip(false); }}>Next →</button>
                      <button className="card" onClick={() => { setFcDeck(shuffle(ALL_FLASHCARDS)); setFcIdx(0); setFcFlip(false); }}>🔀 Shuffle</button>
                    </div>
                  </>
                ) : <p>No flashcards.</p>}
              </div>
            )}

            {page === 'quiz' && (
              <div>
                {!quizActive ? (
                  <div>
                    <h1>Quiz</h1>
                    <div className="grid-2">
                      <button className="card" onClick={() => startQuiz('all')}>🌐 All Units</button>
                      {Object.values(UNITS).map(u => (
                        <button key={u.id} className="card" onClick={() => startQuiz(u.label)}>{u.icon} {u.label}</button>
                      ))}
                    </div>
                  </div>
                ) : quizDone ? (
                  <div className="card text-center">
                    <div style={{ fontSize: '3rem' }}>{quizScore >= 4 ? '🏆' : '👍'}</div>
                    <h2>{quizScore}/{quizDeck.length} correct</h2>
                    <p>+{quizScore * 10 + 20} XP</p>
                    <button className="card" onClick={() => startQuiz('all')}>Try Again</button>
                  </div>
                ) : (
                  <div>
                    <div className="flex-between">
                      <span>Q{quizIdx + 1}/{quizDeck.length}</span>
                      <span>✅ {quizScore}</span>
                    </div>
                    <div className="progress-bar"><div className="progress-fill" style={{ width: `${(quizIdx / quizDeck.length) * 100}%` }} /></div>
                    <div className="card">
                      <p style={{ fontWeight: 'bold' }}>{quizDeck[quizIdx]?.q}</p>
                      <div className="grid-2">
                        {quizDeck[quizIdx]?.opts.map((opt, i) => (
                          <button key={i} className={`quiz-option ${quizSel !== null ? (i === quizDeck[quizIdx].ans ? 'correct' : (i === quizSel ? 'wrong' : '')) : ''}`} onClick={() => handleQuiz(i)} disabled={quizSel !== null}>
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>
                    {quizSel !== null && (
                      <div className={quizSel === quizDeck[quizIdx].ans ? 'feedback-correct' : 'feedback-wrong'}>
                        <p>{quizSel === quizDeck[quizIdx].ans ? '✅ Correct!' : '❌ Incorrect'}</p>
                        <p>{quizDeck[quizIdx].exp}</p>
                        <button className="card" style={{ marginTop: '0.5rem' }} onClick={nextQuiz}>{quizIdx + 1 >= quizDeck.length ? 'Results' : 'Next →'}</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {page === 'reference' && (
              <div>
                <h1>Reference Tables</h1>
                <div className="reference-table">
                  <h2>Physical Constants</h2>
                  <table>
                    <thead><tr><th>Constant</th><th>Value</th><th>Description</th></tr></thead>
                    <tbody>
                      <tr><td>Gravitational acceleration (g)</td><td>9.81 m/s²</td><td>Near Earth's surface</td></tr>
                      <tr><td>Speed of light (c)</td><td>3.00 × 10⁸ m/s</td><td>In vacuum</td></tr>
                      <tr><td>Planck's constant (h)</td><td>6.63 × 10⁻³⁴ J·s</td><td>Quantum mechanics</td></tr>
                    </tbody>
                  </table>
                  <h2>SI Units</h2>
                  <table>
                    <thead><tr><th>Quantity</th><th>Unit</th><th>Equivalent</th></tr></thead>
                    <tbody>
                      <tr><td>Force</td><td>Newton (N)</td><td>kg·m/s²</td></tr>
                      <tr><td>Energy/Work</td><td>Joule (J)</td><td>N·m = kg·m²/s²</td></tr>
                      <tr><td>Power</td><td>Watt (W)</td><td>J/s</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
